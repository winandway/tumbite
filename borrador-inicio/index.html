<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Divoox · Borrador del inicio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rojo: #f20d20;
        --rojo-osc: #c20a1a;
        --rojo-suave: #fdecee;
        --negro: #101010;
        --gris: #666b73;
        --borde: #e6e7ea;
        --borde-f: #2a2a2a;
        --fondo: #f6f6f6;
        --blanco: #ffffff;
        --verde: #0d7a3a;
        --verde-suave: #e6f2ea;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: #edeef0;
        color: var(--negro);
        font-family: Montserrat, system-ui, sans-serif;
        font-size: 15px;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-align: left;
      }
      h1,
      h2,
      h3,
      .t {
        font-family: Poppins, system-ui, sans-serif;
        margin: 0;
      }

      /* ---------- Página que envuelve el teléfono ---------- */
      .pagina {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px 48px;
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 32px;
        align-items: start;
      }
      .lateral h1 {
        font-size: 22px;
        line-height: 1.2;
      }
      .lateral p {
        color: var(--gris);
        line-height: 1.5;
        margin: 8px 0 16px;
      }
      .nota {
        border: 1px solid var(--borde);
        background: #fff;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 13px;
        color: var(--gris);
        line-height: 1.45;
      }
      .lista-pantallas {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 16px 0;
      }
      .lista-pantallas button {
        border: 1px solid var(--borde);
        background: #fff;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 600;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .lista-pantallas button .n {
        width: 24px;
        height: 24px;
        border-radius: 12px;
        background: var(--fondo);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        flex: none;
      }
      .lista-pantallas button[aria-current='true'] {
        border-color: var(--negro);
      }
      .lista-pantallas button[aria-current='true'] .n {
        background: var(--negro);
        color: #fff;
      }
      .escenario {
        display: flex;
        justify-content: center;
      }
      .telefono {
        width: 390px;
        height: 844px;
        background: var(--blanco);
        border-radius: 44px;
        border: 10px solid var(--negro);
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      body.captura {
        background: #fff;
      }
      body.captura .pagina {
        display: block;
        padding: 0;
        max-width: none;
      }
      body.captura .lateral {
        display: none;
      }
      body.captura .telefono {
        border: 0;
        border-radius: 0;
        width: 390px;
        height: 844px;
      }
      @media (max-width: 820px) {
        .pagina {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .telefono {
          width: 100%;
          max-width: 390px;
          height: 780px;
          border-width: 8px;
          border-radius: 36px;
        }
      }

      /* ---------- Selector de idioma (estilo Amazon) ---------- */
      .idioma {
        position: relative;
      }
      .idioma-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid transparent;
      }
      .idioma-btn:hover,
      .idioma.abierto .idioma-btn {
        border-color: var(--negro);
      }
      .idioma-menu {
        display: none;
        position: absolute;
        right: 0;
        top: calc(100% + 10px);
        background: #fff;
        border: 1px solid #d5d9d9;
        border-radius: 8px;
        box-shadow: 0 2px 10px rgba(15, 17, 17, 0.15);
        width: 210px;
        padding: 12px 14px;
        z-index: 30;
      }
      .idioma.abierto .idioma-menu {
        display: block;
      }
      .idioma-menu:before {
        content: '';
        position: absolute;
        top: -7px;
        right: 18px;
        width: 12px;
        height: 12px;
        background: #fff;
        border-left: 1px solid #d5d9d9;
        border-top: 1px solid #d5d9d9;
        transform: rotate(45deg);
      }
      .idioma-menu .tit {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .idioma-op {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 0;
        font-size: 14px;
      }
      .idioma-op + .idioma-op {
        border-top: 1px solid #e7e7e7;
      }
      .radio {
        width: 16px;
        height: 16px;
        border-radius: 8px;
        border: 1px solid #888c8c;
        display: grid;
        place-items: center;
        flex: none;
      }
      .radio.si {
        border-color: #e77600;
      }
      .radio.si:after {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background: #e77600;
      }
      .bandera {
        width: 20px;
        height: 14px;
        border-radius: 2px;
        flex: none;
        display: block;
      }

      /* ---------- Dentro del teléfono ---------- */
      .estado {
        height: 44px;
        flex: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 26px;
        font-size: 14px;
        font-weight: 600;
      }
      .pantalla {
        display: none;
        flex: 1;
        min-height: 0;
        flex-direction: column;
        position: relative;
      }
      .pantalla.activa {
        display: flex;
      }
      .desliza {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .cab {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 16px 10px;
      }
      .cab img {
        height: 26px;
      }
      .cab-der {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .icono-btn {
        width: 40px;
        height: 40px;
        border-radius: 20px;
        display: grid;
        place-items: center;
      }
      .icono-btn:hover {
        background: var(--fondo);
      }
      .entregar {
        padding: 0 16px 10px;
        font-size: 13px;
        color: var(--gris);
      }
      .entregar b {
        color: var(--negro);
      }

      .buscador {
        margin: 4px 16px 0;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--fondo);
        border-radius: 28px;
        padding: 14px 16px;
        font-family: Poppins;
        font-weight: 600;
        font-size: 17px;
        width: calc(100% - 32px);
      }
      .buscador .ahora {
        margin-left: auto;
        background: #fff;
        border-radius: 16px;
        padding: 6px 10px;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        gap: 6px;
        align-items: center;
        border: 1px solid var(--borde);
      }
      .atajos {
        display: flex;
        gap: 8px;
        padding: 12px 16px 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .atajos::-webkit-scrollbar {
        display: none;
      }
      .atajo {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--borde);
        border-radius: 20px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        flex: none;
      }
      .atajo .ico {
        width: 24px;
        height: 24px;
        border-radius: 12px;
        background: var(--fondo);
        display: grid;
        place-items: center;
      }

      .sec {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 20px 16px 10px;
      }
      .sec h2 {
        font-size: 18px;
      }
      .sec .ver {
        font-size: 13px;
        font-weight: 700;
        color: var(--negro);
        text-decoration: underline;
      }

      .carrusel {
        display: flex;
        gap: 10px;
        padding: 0 16px 4px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .carrusel::-webkit-scrollbar {
        display: none;
      }
      .serv {
        flex: none;
        width: 76px;
        scroll-snap-align: start;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .serv .caja {
        width: 76px;
        height: 68px;
        border-radius: 16px;
        background: var(--fondo);
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }
      .serv .caja img {
        max-width: 62px;
        max-height: 50px;
        object-fit: contain;
      }
      .serv .nom {
        font-size: 12.5px;
        font-weight: 600;
        text-align: center;
        line-height: 1.15;
      }
      .serv.destacado .caja {
        background: var(--rojo-suave);
        outline: 1.5px solid var(--rojo);
      }
      .serv .marca {
        position: absolute;
        top: 5px;
        left: 5px;
        background: var(--rojo);
        color: #fff;
        font-size: 9.5px;
        font-weight: 700;
        border-radius: 6px;
        padding: 2px 5px;
        font-family: Poppins;
      }
      .puntos {
        display: flex;
        gap: 4px;
        justify-content: center;
        padding: 8px 0 0;
      }
      .puntos i {
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: #d6d8dc;
      }
      .puntos i.on {
        width: 16px;
        background: var(--negro);
      }

      .tarjeta-moto {
        margin: 16px 16px 0;
        border: 1px solid var(--borde);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        gap: 14px;
        align-items: center;
        width: calc(100% - 32px);
      }
      .tarjeta-moto img {
        width: 92px;
        flex: none;
      }
      .tarjeta-moto .t {
        font-size: 17px;
        line-height: 1.2;
      }
      .tarjeta-moto p {
        margin: 4px 0 10px;
        color: var(--gris);
        font-size: 13px;
        line-height: 1.35;
      }
      .boton-chico {
        display: inline-block;
        background: var(--negro);
        color: #fff;
        border-radius: 18px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 700;
        font-family: Poppins;
      }

      .recientes {
        padding: 0 16px;
      }
      .fila {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        width: 100%;
      }
      .fila + .fila {
        border-top: 1px solid var(--borde);
      }
      .fila .ico {
        width: 38px;
        height: 38px;
        border-radius: 19px;
        background: var(--fondo);
        display: grid;
        place-items: center;
        flex: none;
      }
      .fila .tx {
        flex: 1;
        min-width: 0;
      }
      .fila .tx b {
        display: block;
        font-size: 14.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fila .tx span {
        display: block;
        font-size: 12.5px;
        color: var(--gris);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .platos {
        display: flex;
        gap: 10px;
        padding: 0 16px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .platos::-webkit-scrollbar {
        display: none;
      }
      .plato {
        flex: none;
        width: 150px;
        border: 1px solid var(--borde);
        border-radius: 14px;
        overflow: hidden;
      }
      .plato .foto {
        height: 84px;
        background: var(--fondo);
        display: grid;
        place-items: center;
      }
      .plato .foto img {
        height: 60px;
      }
      .plato div.d {
        padding: 8px 10px;
        font-size: 13px;
      }
      .plato div.d b {
        display: block;
        font-size: 13.5px;
      }
      .plato div.d span {
        color: var(--gris);
        font-size: 12px;
      }

      .barra {
        flex: none;
        height: 76px;
        border-top: 1px solid var(--borde);
        display: flex;
        justify-content: space-around;
        align-items: flex-start;
        padding-top: 8px;
        background: #fff;
      }
      .barra button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        font-weight: 600;
        color: var(--gris);
        width: 70px;
      }
      .barra button.on {
        color: var(--negro);
      }

      /* Pantalla de servicio / mapa */
      .mapa {
        position: relative;
        background: #e9ebee;
        overflow: hidden;
      }
      .mapa svg.calles {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .volver {
        position: absolute;
        top: 10px;
        left: 14px;
        width: 42px;
        height: 42px;
        border-radius: 21px;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        z-index: 3;
      }
      .hoja {
        background: #fff;
        border-radius: 20px 20px 0 0;
        margin-top: -18px;
        position: relative;
        z-index: 2;
        padding: 10px 16px 16px;
        flex: 1;
        overflow-y: auto;
      }
      .agarre {
        width: 40px;
        height: 5px;
        border-radius: 3px;
        background: #d6d8dc;
        margin: 0 auto 12px;
      }
      .hoja h1 {
        font-size: 22px;
        margin-bottom: 12px;
      }
      .campo-viaje {
        border: 1px solid var(--borde-f);
        border-radius: 14px;
        overflow: hidden;
      }
      .campo-viaje .linea {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
      }
      .campo-viaje .linea + .linea {
        border-top: 1px solid var(--borde);
      }
      .campo-viaje .linea .lab {
        font-size: 11.5px;
        color: var(--gris);
        font-weight: 600;
      }
      .campo-viaje .linea .val {
        font-size: 15px;
        font-weight: 600;
      }
      .campo-viaje .linea .val.vacio {
        color: #9a9ea5;
        font-weight: 500;
      }
      .campo-viaje .linea.activa {
        background: #fafafa;
        box-shadow: inset 3px 0 0 var(--negro);
      }
      .punto-r {
        width: 12px;
        height: 12px;
        border-radius: 6px;
        border: 3px solid var(--negro);
        flex: none;
      }
      .punto-d {
        width: 12px;
        height: 12px;
        background: var(--rojo);
        flex: none;
      }
      .fijar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 2px;
        width: 100%;
        color: var(--rojo);
        font-weight: 700;
        font-size: 14px;
      }
      .fijar .fl {
        margin-left: auto;
        color: var(--gris);
      }
      .sug-tit {
        font-size: 12px;
        font-weight: 700;
        color: var(--gris);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 10px 0 0;
      }

      .opciones {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .opcion {
        border: 1px solid var(--borde);
        border-radius: 14px;
        padding: 12px;
        display: flex;
        gap: 12px;
        align-items: center;
        width: 100%;
      }
      .opcion.sel {
        border: 2px solid var(--negro);
        padding: 11px;
      }
      .opcion img {
        width: 66px;
        flex: none;
      }
      .opcion .tx {
        flex: 1;
      }
      .opcion .tx b {
        font-family: Poppins;
        font-size: 16px;
      }
      .opcion .tx span {
        display: block;
        font-size: 12.5px;
        color: var(--gris);
      }
      .opcion .pr {
        text-align: right;
      }
      .opcion .pr b {
        font-family: Poppins;
        font-size: 17px;
        display: block;
      }
      .opcion .pr span {
        font-size: 12px;
        color: var(--gris);
      }
      .pago {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 2px;
        border-top: 1px solid var(--borde);
        margin-top: 12px;
        font-weight: 600;
        width: 100%;
      }
      .pago .fl {
        margin-left: auto;
        color: var(--gris);
        font-size: 13px;
      }
      .boton {
        display: block;
        width: 100%;
        background: var(--rojo);
        color: #fff;
        border-radius: 14px;
        padding: 16px;
        text-align: center;
        font-family: Poppins;
        font-weight: 700;
        font-size: 17px;
      }
      .boton:hover {
        background: var(--rojo-osc);
      }
      .boton.sec2 {
        background: #fff;
        color: var(--negro);
        border: 1px solid var(--borde-f);
      }
      .casco {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-size: 12.5px;
        color: var(--gris);
        margin: 10px 2px 12px;
        line-height: 1.35;
      }

      .pulso {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      .pulso i {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        border-radius: 50%;
        border: 2px solid var(--rojo);
        animation: onda 2.4s infinite;
        opacity: 0;
      }
      .pulso i:nth-child(2) {
        animation-delay: 0.8s;
      }
      .pulso i:nth-child(3) {
        animation-delay: 1.6s;
      }
      @keyframes onda {
        0% {
          transform: scale(0.6);
          opacity: 0.9;
        }
        100% {
          transform: scale(5);
          opacity: 0;
        }
      }
      .pin {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -100%);
        z-index: 2;
      }
      .motito {
        position: absolute;
        width: 30px;
        height: 30px;
        border-radius: 15px;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        display: grid;
        place-items: center;
      }
      .progreso-busq {
        height: 4px;
        background: var(--fondo);
        border-radius: 2px;
        overflow: hidden;
        margin: 4px 0 14px;
      }
      .progreso-busq i {
        display: block;
        height: 100%;
        width: 40%;
        background: var(--negro);
        border-radius: 2px;
        animation: barra 1.6s infinite ease-in-out;
      }
      @keyframes barra {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      .resumen {
        border: 1px solid var(--borde);
        border-radius: 14px;
        padding: 4px 14px;
        margin-bottom: 12px;
      }
      .ok {
        color: var(--verde);
        font-weight: 700;
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
      }
      @media (prefers-reduced-motion: reduce) {
        .pulso i,
        .progreso-busq i {
          animation: none;
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div class="pagina">
      <aside class="lateral">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
          "
        >
          <img src="img/logo.webp" alt="Divoox" style="height: 26px" />
          <div class="idioma" id="idioma-pagina"></div>
        </div>
        <h1 data-t="titulo"></h1>
        <p data-t="intro"></p>
        <div class="lista-pantallas" id="lista"></div>
        <div class="nota" data-t="nota"></div>
      </aside>

      <div class="escenario">
        <div class="telefono" id="telefono">
          <div class="estado">
            <span>9:41</span
            ><span style="display: flex; gap: 6px; align-items: center">
              <svg width="18" height="12" viewBox="0 0 18 12">
                <rect x="0" y="8" width="3" height="4" rx="1" />
                <rect x="5" y="5" width="3" height="7" rx="1" />
                <rect x="10" y="2" width="3" height="10" rx="1" />
                <rect x="15" y="0" width="3" height="12" rx="1" />
              </svg>
              <svg width="26" height="12" viewBox="0 0 26 12">
                <rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#101010" />
