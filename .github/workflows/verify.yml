name: verify
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run audit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # El recorrido completo en el navegador (restaurante, cliente, repartidor, pago simulado,
      # entrega y calificación, en inglés y en español). Si se rompe, no se publica.
      - name: Recorrido completo de un pedido
        run: npm run recorrido
        timeout-minutes: 20
      - name: Rastros del recorrido si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recorrido-rastros
          path: test-results/
          retention-days: 7
