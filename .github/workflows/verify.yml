name: verify
on:
  push:
    branches: [main]
  pull_request:

# C-VERIFY-SOLO-LA-ULTIMA (29 oct 2026): un push nuevo cancela la verificación anterior de la misma
# rama. Solo la última se publica (C-PUBLICAR-VERSION-EXACTA), así que las viejas solo estorbaban:
# tres a la vez tardaban más de 40 minutos y producción no avanzaba.
concurrency:
  group: verify-${{ github.ref }}
  # C-VERIFY-NO-SE-CANCELA (21 nov 2026): en la principal un commit nuevo NO cancela la verificación
  # que ya corría (espera su turno). Dos veces un empujón canceló la corrida anterior y producción se
  # quedó atrás una hora. En las ramas de trabajo sí se cancela la vieja: solo importa la última.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npx playwright test

  # C-RECORRIDO-TANDAS (16 nov 2026): el recorrido completo en el navegador (restaurante, cliente,
  # repartidor, pago simulado, entrega y calificación, en inglés y en español), en CUATRO tandas a la vez,
  # cada una en su máquina y con su propia base. En un solo carril pasaba de 20 minutos y frenaba la
  # publicación. Las tandas salen de scripts/recorrido/tandas.mjs (por tiempo medido; la 3 y la 4 se reparten «todo lo
  # demás»). Cada tanda avisa en la corrida si pasa del 70 % de su límite. Si una se rompe, no se publica.
  recorrido:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tanda: [1, 2, 3, 4]
    name: recorrido (tanda ${{ matrix.tanda }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Recorrido completo de un pedido
        run: >-
          node scripts/recorrido/con-tiempo.mjs 20 "Recorrido, tanda ${{ matrix.tanda }}" --
          npm run recorrido -- $(node scripts/recorrido/tandas.mjs ${{ matrix.tanda }})
        timeout-minutes: 20
      - name: Rastros del recorrido si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recorrido-rastros-${{ matrix.tanda }}
          path: test-results/
          retention-days: 7
