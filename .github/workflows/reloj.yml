name: reloj
# El reloj externo de Tumbite. YaDominios Cloud no tiene tareas programadas, así que GitHub
# llama cada 5 minutos a /datos/reloj (producción y pruebas) con el secreto RELOJ_SECRETO,
# y una vez al día (08:00 UTC = 3 am Miami) pide la copia de seguridad de la base.
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      respaldo:
        description: 'Hacer también la copia de seguridad'
        type: boolean
        default: false

jobs:
  tic:
    runs-on: ubuntu-latest
    steps:
      - name: Producción
        run: |
          curl -fsS -X POST https://tumbite.com/datos/reloj -H "x-reloj-secreto: ${{ secrets.RELOJ_SECRETO }}" || { echo "::error::El reloj de producción falló"; exit 1; }
      - name: Pruebas
        run: |
          curl -fsS -X POST https://staging.tumbite.com/datos/reloj -H "x-reloj-secreto: ${{ secrets.RELOJ_SECRETO }}" || echo "::warning::El reloj de pruebas falló"
      # GitHub no corre los horarios a la hora exacta (a veces pasa horas sin correr): en cada
      # vuelta se pide el respaldo y el servidor solo lo hace si hoy todavía no hay uno.
      - name: Copia de seguridad diaria (producción)
        run: |
          curl -fsS -X POST "https://tumbite.com/datos/respaldo?siHaceFalta=1" -H "x-reloj-secreto: ${{ secrets.RELOJ_SECRETO }}" || { echo "::error::La copia de seguridad falló"; exit 1; }
