name: publicar
# Compila el panel y el servidor y empuja el resultado a DOS ramas, en orden:
# 1) yapanel-pruebas → el sitio tumbite-pruebas (su propia base y almacén).
# 2) Si la variable URL_PRUEBAS está puesta, se espera a que pruebas sirva esta versión y
#    responda 200 en las rutas críticas. Solo entonces:
# 3) yapanel-build → tumbite.com (producción). YaDominios Cloud republica solo cada rama.
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]

# Una publicación a la vez: si llegan dos juntas, la segunda espera (13 oct 2026 chocaron dos
# y una falló al empujar la rama de pruebas).
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # C-PUBLICAR-VERSION-EXACTA (29 oct 2026): con dos cambios seguidos, la publicación del primero
  # bajaba el código del segundo y el control lo frenaba («la web no lleva el commit …»). Ahora solo
  # se publica si la versión verificada sigue siendo la última de main (la más nueva ya trae todo y
  # se publica cuando termine su verificación), y se baja EXACTAMENTE esa versión.
  revisar:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      ultima: ${{ steps.r.outputs.ultima }}
    steps:
      - id: r
        env:
          VERSION: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUNTA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          # Los cambios con [skip ci] no se verifican ni se publican solos: no cuentan como «más nuevos».
          NUEVOS=$(gh api "repos/${{ github.repository }}/compare/${VERSION}...main" \
            --jq '[.commits[] | select(.commit.message | test("\\[skip ci\\]") | not)] | length')
          if [ "$PUNTA" = "$VERSION" ] || [ "$NUEVOS" = "0" ]; then echo "ultima=true" >> "$GITHUB_OUTPUT"; else
            echo "ultima=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${VERSION:0:7} no se publica: main ya va en ${PUNTA:0:7}, que se publica al terminar su verificación."
          fi
  publicar:
    needs: revisar
    if: ${{ needs.revisar.outputs.ultima == 'true' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
      # C-ENTORNOS-SEPARADOS: un paquete por entorno, desde cero y con SU dirección, revisado
      # antes de publicar (sin direcciones cruzadas ni secretos). Nunca se copia uno al otro.
      - name: Paquete de PRUEBAS (revisado)
        run: bash scripts/empaquetar.sh pruebas
      - name: Publicar en pruebas (rama yapanel-pruebas)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: yapanel-pruebas
          publish_dir: ./out-pruebas

      - name: Semáforo — pruebas debe servir esta versión y responder 200
        if: ${{ vars.URL_PRUEBAS != '' }}
        run: bash scripts/semaforo.sh "${{ vars.URL_PRUEBAS }}" "${VERSION:0:7}" yapanel-pruebas
        timeout-minutes: 30

      - name: Paquete de PRODUCCIÓN (revisado; nunca el de pruebas)
        run: bash scripts/empaquetar.sh produccion

      - name: Publicar en producción (rama yapanel-build)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: yapanel-build
          publish_dir: ./out-produccion

      # Después de publicar: producción tiene que servir ESTA versión y su salud (con la pieza
      # «entorno») responder 200. Si no, queda en rojo para actuar de inmediato.
      - name: Semáforo de producción (solo lectura)
        run: bash scripts/semaforo.sh "https://divoox.com" "${VERSION:0:7}" yapanel-build
        timeout-minutes: 30
