name: publicar
# Compila el panel y el servidor y empuja el resultado a DOS ramas, en orden:
# 1) yapanel-pruebas → el sitio tumbite-pruebas (su propia base y almacén).
# 2) Si la variable URL_PRUEBAS está puesta, se espera a que pruebas sirva esta versión y
#    responda 200 en las rutas críticas. Solo entonces:
# 3) yapanel-build → tumbite.com (producción). YaDominios Cloud republica solo cada rama.
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publicar:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
      # La app del cliente también en versión web, en tumbite.com/app (para probar sin tiendas).
      - run: npm run build:app-web
      # La app del repartidor en versión web, en tumbite.com/driver (para la prueba en la calle).
      - run: npm run build:repartidor-web
      - run: |
          mkdir out-deploy
          cp apps/servidor/.dist-worker/index.js out-deploy/_worker.js
          cp -r apps/panel/dist/* out-deploy/
          mkdir -p out-deploy/app && cp -r apps/cliente/dist-web/* out-deploy/app/
          mkdir -p out-deploy/driver && cp -r apps/repartidor/dist-web/* out-deploy/driver/
          cp schema.sql out-deploy/
          echo '{ "compatibility_date": "2026-09-01", "compatibility_flags": ["nodejs_compat"] }' > out-deploy/yadominios.json
          test -s out-deploy/_worker.js || { echo "::error::No se generó el _worker.js"; exit 1; }

      - name: Publicar en pruebas (rama yapanel-pruebas)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: yapanel-pruebas
          publish_dir: ./out-deploy

      - name: Semáforo — pruebas debe servir esta versión y responder 200
        if: ${{ vars.URL_PRUEBAS != '' }}
        run: bash scripts/semaforo.sh "${{ vars.URL_PRUEBAS }}" "${VERSION:0:7}"

      - name: Publicar en producción (rama yapanel-build)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: yapanel-build
          publish_dir: ./out-deploy
