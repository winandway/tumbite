name: pruebas-rama
# Publica una rama de trabajo («fase-*») SOLO en el sitio de pruebas (rama yapanel-pruebas →
# tumbite-pruebas, con su propia base y su propio almacén, sin llaves de Stripe). NUNCA toca
# producción: no hay ningún paso que empuje a yapanel-build. Fase 0 (15 oct 2026).
on:
  push:
    branches: ['fase-*']
  workflow_dispatch:

# La misma fila que «publicar»: si llegan dos a la vez, la segunda espera.
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}
      - run: npm run audit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v2 (fijado al commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # C-ENTORNOS-SEPARADOS: el paquete de pruebas se arma con la dirección de pruebas y se revisa;
      # el de producción también se arma y se revisa (NO se publica), para probar que sale limpio.
      - name: Paquete de PRUEBAS (revisado)
        run: bash scripts/empaquetar.sh pruebas
      - name: Paquete de PRODUCCIÓN (solo se revisa, no se publica)
        run: bash scripts/empaquetar.sh produccion
      - name: Publicar SOLO en pruebas (rama yapanel-pruebas)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4 (fijado al commit)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: yapanel-pruebas
          publish_dir: ./out-pruebas
      - name: Semáforo — pruebas debe servir esta versión y responder 200
        if: ${{ vars.URL_PRUEBAS != '' }}
        run: bash scripts/semaforo.sh "${{ vars.URL_PRUEBAS }}" "${VERSION:0:7}" yapanel-pruebas
        timeout-minutes: 30
      - name: Viaje de Moto de punta a punta (C-MOTO-SOLO-PRUEBAS)
        if: ${{ vars.URL_PRUEBAS != '' }}
        env:
          URL_PRUEBAS: ${{ vars.URL_PRUEBAS }}
          RELOJ_SECRETO: ${{ secrets.RELOJ_SECRETO }}
        run: node scripts/staging/probar-moto.mjs
      - name: Avisos de Stripe de prueba con los eventos de Flex (recargas, reembolsos, disputas)
        if: ${{ vars.URL_PRUEBAS != '' }}
        continue-on-error: true
        env:
          URL_PRUEBAS: ${{ vars.URL_PRUEBAS }}
          RELOJ_SECRETO: ${{ secrets.RELOJ_SECRETO }}
        run: |
          curl -sS -X POST "$URL_PRUEBAS/datos/interno-stripe/avisos/principal/eventos" -H "x-reloj-secreto: $RELOJ_SECRETO" -w "\nHTTP %{http_code}\n"
      - name: Pruebas S de la Fase 0 dentro del sitio de pruebas (S2–S5, S7, S11)
        if: ${{ vars.URL_PRUEBAS != '' }}
        env:
          URL_PRUEBAS: ${{ vars.URL_PRUEBAS }}
          RELOJ_SECRETO: ${{ secrets.RELOJ_SECRETO }}
        run: node scripts/staging/probar-staging.mjs
      - name: Tiempo real en vivo (WebSocket, GPS, firmas, reconexión, lote y reloj externo)
        if: ${{ !cancelled() && vars.URL_PRUEBAS != '' && vars.TIEMPO_REAL_URL_PRUEBAS != '' }}
        env:
          URL_PRUEBAS: ${{ vars.URL_PRUEBAS }}
          TIEMPO_REAL_URL: ${{ vars.TIEMPO_REAL_URL_PRUEBAS }}
          RELOJ_SECRETO: ${{ secrets.RELOJ_SECRETO }}
          AVISOS_LLAVE_ID: ${{ secrets.AVISOS_LLAVE_ID_PRUEBAS }}
          AVISOS_SECRETO: ${{ secrets.AVISOS_SECRETO_PRUEBAS }}
        run: node scripts/staging/probar-tiempo-real.mjs
      - name: Recorrido completo de Comida en el sitio de pruebas (Stripe en modo prueba)
        if: ${{ !cancelled() && vars.URL_PRUEBAS != '' }}
        env:
          RECORRIDO_URL: ${{ vars.URL_PRUEBAS }}
          RECORRIDO_SECRETO: ${{ secrets.RELOJ_SECRETO }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.recorrido-staging.config.ts
      - name: Guardar capturas y rastro del recorrido si falló
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: recorrido-staging
          path: test-results/
          retention-days: 7
      - name: Conciliación de saldos contra Stripe (modo prueba)
        if: ${{ !cancelled() && vars.URL_PRUEBAS != '' }}
        env:
          URL_PRUEBAS: ${{ vars.URL_PRUEBAS }}
          RELOJ_SECRETO: ${{ secrets.RELOJ_SECRETO }}
        run: node scripts/staging/conciliar-staging.mjs
