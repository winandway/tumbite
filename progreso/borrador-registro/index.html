<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Divoox · Borrador del registro nuevo</title>
    <link rel="icon" href="img/isotipo-oscuro.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rojo: #f20d20;
        --rojo-osc: #c20a1a;
        --negro: #101010;
        --gris: #666b73;
        --gris-2: #9a9ea5;
        --borde: #e2e4e8;
        --fondo: #f6f6f6;
        --verde: #0d7a3a;
        --verde-suave: #e6f2ea;
        --ambar: #8a5a00;
        --ambar-suave: #fff4dc;
        --app: #f20d20;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #ecedef;
        color: var(--negro);
        font-family: Montserrat, system-ui, sans-serif;
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      h1,
      h2,
      h3 {
        font-family: Poppins, system-ui, sans-serif;
        margin: 0;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid #1a66d6;
        outline-offset: 2px;
      }

      /* La barra del borrador: qué app se mira. */
      .barra {
        background: #fff;
        border-bottom: 1px solid var(--borde);
        padding: 10px 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .barra .titulo {
        font-family: Poppins, sans-serif;
        font-weight: 600;
        font-size: 15px;
        margin-right: auto;
      }
      .pestanas {
        display: inline-flex;
        background: var(--fondo);
        border: 1px solid var(--borde);
        border-radius: 999px;
        padding: 3px;
      }
      .pestanas button {
        padding: 7px 14px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 13px;
        color: var(--gris);
      }
      .pestanas button[aria-pressed='true'] {
        background: var(--negro);
        color: #fff;
      }
      .barra .suelto {
        font-size: 13px;
        font-weight: 600;
        color: var(--gris);
        text-decoration: underline;
      }

      .pagina {
        max-width: 1240px;
        margin: 0 auto;
        padding: 24px 16px 48px;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) 390px minmax(240px, 1.15fr);
        gap: 28px;
        align-items: start;
      }
      .lado h2 {
        font-size: 16px;
        margin-bottom: 8px;
      }
      .lado p {
        color: var(--gris);
        line-height: 1.5;
        font-size: 14px;
        margin: 0 0 12px;
      }
      .caja {
        background: #fff;
        border: 1px solid var(--borde);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 14px;
      }
      .caja ul {
        margin: 0;
        padding-left: 18px;
        color: #33363b;
        font-size: 13.5px;
        line-height: 1.5;
      }
      .caja li + li {
        margin-top: 6px;
      }
      .mapa {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .mapa button {
        text-align: left;
        padding: 7px 10px;
        border-radius: 8px;
        font-size: 13.5px;
        color: #33363b;
        display: flex;
        gap: 8px;
      }
      .mapa button .n {
        color: var(--gris-2);
        min-width: 16px;
        font-variant-numeric: tabular-nums;
      }
      .mapa button[aria-current='true'] {
        background: var(--negro);
        color: #fff;
        font-weight: 600;
      }
      .mapa button[aria-current='true'] .n {
        color: #cfd1d5;
      }
      .mapa .sep {
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--gris-2);
        margin: 10px 10px 2px;
      }
      .orden {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .orden button {
        border: 1px solid var(--borde);
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 12.5px;
        font-weight: 600;
        background: #fff;
      }
      .orden button[aria-pressed='true'] {
        border-color: var(--negro);
        background: var(--negro);
        color: #fff;
      }

      /* El teléfono. */
      .tel {
        width: 390px;
        height: 800px;
        background: #fff;
        border-radius: 38px;
        border: 9px solid #17181a;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
        overflow: hidden;
        position: relative;
      }
      .pantalla {
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .cab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 8px;
        min-height: 56px;
      }
      .cab.color {
        background: var(--app);
        color: #fff;
      }
      .atras {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .atras:hover {
        background: rgba(0, 0, 0, 0.06);
      }
      .cab .hueco {
        flex: 1;
      }
      .cab .cuenta {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--gris);
      }
      .idioma {
        position: relative;
      }
      .idioma > button {
        background: var(--app);
        color: #fff;
        font-weight: 700;
        font-size: 13px;
        border-radius: 8px;
        padding: 7px 9px;
        border: 1px solid transparent;
        display: inline-flex;
        gap: 5px;
        align-items: center;
      }
      .cab.color .idioma > button {
        background: transparent;
      }
      .idioma > button:hover,
      .idioma > button[aria-expanded='true'] {
        border-color: #fff;
        box-shadow: 0 0 0 1px var(--app);
      }
      .idioma .ventana {
        position: absolute;
        right: 0;
        top: calc(100% + 10px);
        width: 220px;
        background: #fff;
        color: var(--negro);
        border: 1px solid #d5d9d9;
        border-radius: 8px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.18);
        padding: 12px 14px 6px;
        z-index: 30;
      }
      .idioma .ventana::before {
        content: '';
        position: absolute;
        top: -7px;
        right: 22px;
        width: 12px;
        height: 12px;
        background: #fff;
        border-left: 1px solid #d5d9d9;
        border-top: 1px solid #d5d9d9;
        transform: rotate(45deg);
      }
      .idioma .ventana b {
        display: block;
        font-size: 13.5px;
        margin-bottom: 4px;
      }
      .idioma label {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 0;
        font-size: 14px;
        cursor: pointer;
      }
      .idioma label + label {
        border-top: 1px solid #e7e7e7;
      }
      .idioma input {
        accent-color: #e47911;
        width: 17px;
        height: 17px;
        margin: 0;
      }
      .progreso {
        height: 5px;
        background: #e9ebee;
        margin: 0 20px;
        border-radius: 999px;
        overflow: hidden;
      }
      .progreso i {
        display: block;
        height: 100%;
        background: var(--verde);
        border-radius: 999px;
        transition: width 0.25s ease;
      }
      .cuerpo {
        flex: 1;
        overflow-y: auto;
        padding: 22px 22px 10px;
      }
      .cuerpo h1 {
        font-size: 25px;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .cuerpo .ayuda {
        color: var(--gris);
        line-height: 1.45;
        margin: 8px 0 20px;
      }
      .campo label,
      .etq {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .campo input[type='text'],
      .campo input[type='email'],
      .campo input[type='tel'],
      .campo input[type='password'],
      .campo input[type='time'] {
        width: 100%;
        height: 54px;
        border: 1.5px solid #c9ccd1;
        border-radius: 12px;
        padding: 0 14px;
        font-size: 17px;
        background: #fff;
      }
      .campo input:focus {
        outline: none;
        border-color: var(--negro);
        box-shadow: 0 0 0 3px rgba(16, 16, 16, 0.08);
      }
      .campo input::placeholder {
        color: #a3a7ae;
      }
      .fila {
        display: flex;
        gap: 8px;
      }
      .fila > input {
        flex: 1;
        min-width: 0;
      }
      .fila .pref {
        width: 78px !important;
        flex: none !important;
        text-align: center;
        padding: 0 6px !important;
      }
      .conojo {
        position: relative;
      }
      .conojo input {
        padding-right: 54px !important;
      }
      .conojo button {
        position: absolute;
        right: 6px;
        top: 7px;
        width: 40px;
        height: 40px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        color: var(--gris);
      }
      .error {
        color: #b00015;
        font-size: 13.5px;
        font-weight: 600;
        margin-top: 8px;
      }
      .pista {
        color: var(--gris);
        font-size: 13px;
        margin-top: 8px;
        line-height: 1.4;
      }
      .recuperado {
        background: var(--fondo);
        border-radius: 10px;
        padding: 9px 12px;
        font-size: 13px;
        color: #33363b;
        margin-bottom: 16px;
      }
      .recuperado button {
        text-decoration: underline;
        font-weight: 600;
      }
      .casilla {
        display: flex;
        gap: 11px;
        align-items: flex-start;
        margin-top: 16px;
        font-size: 13.5px;
        line-height: 1.45;
        color: #33363b;
      }
      .casilla button {
        width: 24px;
        height: 24px;
        border-radius: 5px;
        border: 2px solid #6b7078;
        flex: none;
        display: grid;
        place-items: center;
        background: #fff;
        margin-top: 1px;
      }
      .casilla button[aria-checked='true'] {
        background: var(--rojo);
        border-color: var(--rojo);
      }
      .casilla u {
        font-weight: 600;
        color: var(--negro);
      }
      .pie {
        padding: 10px 22px 16px;
        background: #fff;
      }
      .boton {
        width: 100%;
        height: 54px;
        border-radius: 12px;
        background: var(--rojo);
        color: #fff;
        font-family: Poppins, sans-serif;
        font-weight: 600;
        font-size: 16.5px;
        text-align: center;
      }
      .boton:active {
        background: var(--rojo-osc);
      }
      .boton.borde {
        background: #fff;
        color: var(--negro);
        border: 1.5px solid var(--negro);
      }
      .boton.apagado {
        background: #e3e5e8;
        color: #7b8087;
      }
      .enlace {
        display: block;
        width: 100%;
        text-align: center;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 0 2px;
        text-decoration: underline;
      }
      .enlace.suave {
        color: var(--gris);
        font-weight: 500;
      }
      .portada {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 26px;
      }
      .portada img {
        width: 190px;
        display: block;
        margin-bottom: 26px;
      }
      .portada h1 {
        font-size: 29px;
        line-height: 1.15;
        letter-spacing: -0.015em;
      }
      .portada p {
        color: var(--gris);
        line-height: 1.5;
        margin: 10px 0 0;
      }
      .oscura {
        background: var(--app);
        color: #fff;
      }
      .oscura .portada p {
        color: rgba(255, 255, 255, 0.82);
      }
      .oscura .pie {
        background: transparent;
      }
      .oscura .boton.borde {
        background: transparent;
        color: #fff;
        border-color: rgba(255, 255, 255, 0.75);
      }
      .oscura .enlace {
        color: #fff;
      }
      .oscura .boton:not(.borde) {
        background: #fff;
        color: var(--negro);
      }
      .resumen {
        border: 1px solid var(--borde);
        border-radius: 12px;
        margin-bottom: 4px;
      }
      .resumen > div {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 11px 14px;
        font-size: 14px;
      }
      .resumen > div + div {
        border-top: 1px solid var(--borde);
      }
      .resumen span {
        color: var(--gris);
        font-size: 12.5px;
        display: block;
      }
      .resumen b {
        font-weight: 600;
        word-break: break-word;
      }
      .resumen button {
        margin-left: auto;
        font-size: 13px;
        font-weight: 600;
        text-decoration: underline;
        flex: none;
      }
      .correo-grande {
        border: 1.5px solid var(--negro);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 12px;
      }
      .correo-grande .arriba {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 8px;
      }
      .resumen .editar {
        text-decoration: none;
      }
      .correo-grande span {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--gris);
        display: block;
        margin-bottom: 4px;
      }
      .correo-grande b {
        display: block;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.03em;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .correo-grande p {
        margin: 10px 0 0;
        font-size: 13.5px;
        line-height: 1.4;
        color: #33363b;
      }
      .editar {
        border: 1.5px solid var(--negro);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 700;
        flex: none;
        margin-left: auto;
      }
      .sugiere {
        display: block;
        width: 100%;
        text-align: left;
        margin-top: 10px;
        background: var(--ambar-suave);
        color: var(--ambar);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
        font-weight: 600;
      }
      .sugiere u {
        color: var(--negro);
      }
      .franja-ok {
        background: var(--verde-suave);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 12px;
        color: #0a4f27;
        font-size: 13.5px;
        line-height: 1.4;
      }
      .franja-ok b {
        display: block;
        font-family: Poppins, sans-serif;
        font-size: 16px;
        color: var(--verde);
        margin-bottom: 2px;
      }
      .chips {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chips button {
        border: 1.5px solid #c9ccd1;
        border-radius: 12px;
        padding: 15px 14px;
        text-align: left;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .chips button i {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 2px solid #6b7078;
        display: grid;
        place-items: center;
        flex: none;
      }
      .chips button[aria-pressed='true'] {
        border-color: var(--negro);
        background: var(--fondo);
      }
      .chips button[aria-pressed='true'] i {
        background: var(--negro);
        border-color: var(--negro);
      }

      /* ---------- Asistente de fotos: hormas, cámara y miniaturas ---------- */
      .tira {
        display: flex;
        gap: 6px;
        margin: -6px 0 16px;
        overflow-x: auto;
        padding: 4px 2px;
      }
      .tira button {
        flex: none;
        border-radius: 10px;
        padding: 3px;
        border: 2px solid transparent;
        opacity: 0.75;
      }
      .tira button[aria-current='true'] {
        border-color: var(--negro);
        opacity: 1;
      }
      .mini {
        position: relative;
        display: block;
        background: #f1f2f4;
        border-radius: 7px;
        overflow: visible;
        flex: none;
      }
      .mini svg {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 7px;
      }
      .mini.circ,
      .mini.circ svg {
        border-radius: 999px;
      }
      .mini .ok,
      .horma .ok {
        position: absolute;
        right: -5px;
        bottom: -5px;
        width: 17px;
        height: 17px;
        border-radius: 999px;
        background: var(--verde);
        border: 2px solid #fff;
        display: grid;
        place-items: center;
      }
      .mini .ok svg {
        width: 9px;
        height: 9px;
        border-radius: 0;
      }
      .lado-doc {
        font-family: Poppins, sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.14em;
        color: var(--gris);
        text-align: center;
        margin-bottom: 8px;
      }
      .horma {
        position: relative;
        margin: 0 auto 14px;
        width: 250px;
        aspect-ratio: 1.586;
      }
      .horma svg {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 14px;
      }
      .horma.ovalo {
        width: 170px;
        aspect-ratio: 0.8;
      }
      .horma.ovalo svg {
        border-radius: 50%;
      }
      .horma.circulo {
        width: 170px;
        aspect-ratio: 1;
      }
      .horma.circulo svg {
        border-radius: 50%;
      }
      .horma.tomada.ovalo {
        width: 180px;
        aspect-ratio: 1;
      }
      .horma.tomada svg {
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
        animation: aparece 0.35s ease;
      }
      .horma .ok {
        width: 30px;
        height: 30px;
        right: 4px;
        bottom: 4px;
        border-width: 3px;
        animation: salta 0.45s ease;
      }
      .horma .ok svg {
        width: 15px;
        height: 15px;
        box-shadow: none;
        border-radius: 0;
      }
      .centro {
        text-align: center;
      }
      .aviso-foto {
        background: var(--ambar-suave);
        color: var(--ambar);
        border-radius: 12px;
        padding: 12px 14px;
        font-weight: 600;
        font-size: 14px;
        line-height: 1.4;
        margin: 0 0 14px;
        text-align: center;
      }
      .cuerpo .boton + .boton {
        margin-top: 10px;
      }
      .camara {
        position: absolute;
        inset: 0;
        background: linear-gradient(160deg, #5c6168, #2c2f34 60%, #44484e);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        z-index: 20;
      }
      .camara .cab {
        width: 100%;
        position: relative;
        z-index: 2;
      }
      .cam-lado {
        position: relative;
        z-index: 2;
        font-family: Poppins, sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.12em;
        margin-top: 18px;
      }
      .cam-titulo {
        position: relative;
        z-index: 2;
        font-weight: 600;
        opacity: 0.9;
        margin-top: 2px;
      }
      .cam-marco {
        position: relative;
        z-index: 1;
        margin-top: 34px;
        width: 310px;
        aspect-ratio: 1.586;
        border: 3px solid #fff;
        border-radius: 16px;
        box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.6);
      }
      .cam-marco.ovalo {
        width: 220px;
        aspect-ratio: 0.78;
        border-radius: 50%;
      }
      .cam-marco.circulo {
        width: 240px;
        aspect-ratio: 1;
        border-radius: 50%;
      }
      .cam-marco svg {
        width: 100%;
        height: 100%;
        opacity: 0.55;
      }
      .cam-frase {
        position: relative;
        z-index: 2;
        margin: 26px 34px 0;
        text-align: center;
        font-size: 16px;
        line-height: 1.4;
        font-weight: 600;
      }
      .disparo {
        position: absolute;
        z-index: 2;
        bottom: 34px;
        width: 74px;
        height: 74px;
        border-radius: 999px;
        background: #fff;
        border: 5px solid rgba(255, 255, 255, 0.45);
        background-clip: padding-box;
      }
      .rejilla-papeles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .rejilla-papeles button {
        border: 1px solid var(--borde);
        border-radius: 14px;
        padding: 14px 10px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
      }
      .rejilla-papeles small {

        return `<div class="caja"><h2>${x(L('Probar el asistente de fotos', 'Try the photo assistant'))}</h2><p style="margin:0">${x(L('El borrador no usa la cámara: dibuja la foto. Elige cómo «sale» la próxima.', 'The draft doesn’t use the camera: it draws the photo. Choose how the next one “turns out”.'))}</p>
            <div class="orden">${b('prueba', '', aviso === '', L('Sale bien', 'Good photo'))}${b('prueba', 'mal', aviso === 'mal', L('No es lo que se pidió', 'Not what was asked'))}${b('prueba', 'borrosa', aviso === 'borrosa', L('Sale borrosa', 'Blurry'))}</div></div>
          ${
            E.app === 'restaurante'
              ? ''
              : `<div class="caja"><h2>${x(L('Perfil del conductor', 'Driver profile'))}</h2><p style="margin:0">${x(L('Dos variantes para elegir. Recomendamos la oscura: la foto resalta más.', 'Two variants to choose from. We recommend the dark one: the photo stands out more.'))}</p>
            <div class="orden">${b('variante', 'oscura', (E.perfil || 'oscura') === 'oscura', L('Oscura', 'Dark'))}${b('variante', 'clara', E.perfil === 'clara', L('Clara', 'Light'))}${b('trayectoria', '', !E.trayectoria, L('Conductor nuevo', 'New driver'))}${b('trayectoria', '1', Boolean(E.trayectoria), L('Con trayectoria (ejemplo)', 'Experienced (example)'))}</div></div>`
          }`;
      }

      /* ---------- Estado, con borrador que no se pierde ---------- */
      const nuevoDeApp = () => ({ pantalla: 'inicio', v: {}, hechas: {}, acepto: false });
      let E = { app: 'cliente', lang: null, orden: 'auto', apps: {} };
      try {
        const guardado = JSON.parse(localStorage.getItem(LLAVE) || 'null');
        if (guardado && guardado.apps) E = guardado;
      } catch {
        /* sin almacenamiento: el borrador funciona igual, solo no recuerda */
      }
      for (const a of ORDEN_APPS) E.apps[a] = { ...nuevoDeApp(), ...(E.apps[a] || {}) };
      const recuperado = {};
      for (const a of ORDEN_APPS)
        recuperado[a] = /^paso-/.test(E.apps[a].pantalla) && Object.keys(E.apps[a].v).length > 0;
      if (!E.lang) E.lang = /^es/i.test(navigator.language || '') ? 'es' : 'en';
      // La contraseña nunca se guarda; vive solo mientras la página está abierta.
      const claves = {};
      let ui = { idioma: false, ayuda: false, ojo: false, error: '', brindis: '' };

      function leerDireccion() {
        const m = /^#\/?([a-z]+)(?:\/([a-z0-9-]+))?(?:\/(es|en))?/.exec(location.hash);
        if (!m) return;
        if (APPS[m[1]]) E.app = m[1];
        if (m[2]) E.apps[E.app].pantalla = m[2];
        if (m[3]) E.lang = m[3];
      }
      leerDireccion();
      const A = () => APPS[E.app];
      const S = () => E.apps[E.app];
      const x = (par) => (par ? par[E.lang] : '');
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      function guardar() {
        try {
          localStorage.setItem(LLAVE, JSON.stringify(E));
        } catch {
          /* sin almacenamiento */
        }
        history.replaceState(null, '', `#${E.app}/${S().pantalla}/${E.lang}`);
      }

      /* ---------- La fecha: el orden lo decide la región del teléfono ---------- */
      function ordenFecha() {
        if (E.orden === 'mda') return ['mes', 'dia', 'anio'];
        if (E.orden === 'dma') return ['dia', 'mes', 'anio'];
        try {
          const partes = new Intl.DateTimeFormat(navigator.language, {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
          })
            .formatToParts(new Date(Date.UTC(2001, 1, 3, 12)))
            .map((p) => p.type)
            .filter((t) => t === 'day' || t === 'month' || t === 'year');
          if (partes[0] === 'month') return ['mes', 'dia', 'anio'];
        } catch {
          /* día/mes/año */
        }
        return ['dia', 'mes', 'anio'];
      }
      function escribirFecha(nuevo, anterior) {
        const orden = ordenFecha();
        let d = nuevo.replace(/\D/g, '');
        // Borrar hacia atrás se come la barra.
        if (
          anterior &&
          nuevo.length < anterior.length &&
          anterior.endsWith('/') &&
          !nuevo.endsWith('/')
        )
          d = d.slice(0, -1);
        let salida = '';
        for (const parte of orden) {
          const largo = parte === 'anio' ? 4 : 2;
          if (!d.length) break;
          let trozo = d.slice(0, largo);
          // Un primer dígito imposible se completa solo: «4» en el día pasa a «04».
          if (largo === 2 && trozo.length === 1 && Number(trozo) > (parte === 'dia' ? 3 : 1)) {
            trozo = `0${trozo}`;
            d = d.slice(1);
          } else d = d.slice(trozo.length);
          salida += trozo;
          if (trozo.length === largo && parte !== orden[2]) salida += '/';
        }
        return salida;
      }
      function fechaEscrita(texto) {
        const orden = ordenFecha();
        const trozos = texto.split('/');
        if (trozos.length !== 3 || trozos[2].length !== 4) return null;
        const v = {};
        orden.forEach((parte, i) => (v[parte] = Number(trozos[i])));
        const f = new Date(v.anio, v.mes - 1, v.dia);
        if (f.getFullYear() !== v.anio || f.getMonth() !== v.mes - 1 || f.getDate() !== v.dia)
          return null;
        if (f > new Date() || v.anio < 1900) return null;
        return f;
      }
      const moldeFecha = () =>
        ordenFecha()
          .map((p) => (p === 'dia' ? 'DD' : p === 'mes' ? 'MM' : E.lang === 'es' ? 'AAAA' : 'YYYY'))
          .join('/');
      function prefijo() {
        const region = (/[-_]([A-Za-z]{2})\b/.exec(navigator.language || '') || [])[1];
        return (
          { US: '+1', VE: '+58', PE: '+51', CO: '+57', MX: '+52' }[(region || '').toUpperCase()] ||
          '+'
        );
      }

      /* ---------- El correo: validación seria y aviso si el dominio parece mal escrito ---------- */
      const DOMINIOS = [
        'gmail.com',
        'hotmail.com',
        'outlook.com',
        'yahoo.com',
        'icloud.com',
        'live.com',
        'msn.com',
        'aol.com',
        'proton.me',
        'hotmail.es',
        'outlook.es',
        'yahoo.es',
      ];
      const correoValido = (c) =>
        /^[a-z0-9._%+-]+@[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}$/i.test(c) &&
        !/\.\.|^\.|\.@|@-|-\./.test(c);
      function distancia(a, b) {
        const f = Array.from({ length: a.length + 1 }, (_, i) => [i]);
        for (let j = 1; j <= b.length; j++) f[0][j] = j;
        for (let i = 1; i <= a.length; i++)
          for (let j = 1; j <= b.length; j++)
            f[i][j] = Math.min(
              f[i - 1][j] + 1,
              f[i][j - 1] + 1,
              f[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
            );
        return f[a.length][b.length];
      }
      /** El correo corregido si el dominio parece un error de dedo; si no, null. */
      function correoCorregido(correo) {
        const m = /^([^@\s]+)@([^@\s]+\.[^@\s]+)$/.exec((correo || '').trim().toLowerCase());
        if (!m || DOMINIOS.includes(m[2])) return null;
        let mejor = null;
        for (const d of DOMINIOS) {
          const n = distancia(m[2], d);
          if (n <= 2 && (!mejor || n < mejor.n)) mejor = { d, n };
        }
        if (mejor) return `${m[1]}@${mejor.d}`;
        const cola = /\.(con|cmo|ocm|vom|xom|comm|coom)$/.exec(m[2]);
        return cola ? `${m[1]}@${m[2].slice(0, -cola[1].length)}com` : null;
      }
      function sugiereCorreo(correo) {
        const c = correoCorregido(correo);
        return c
          ? `<button type="button" class="sugiere" data-a="corregir" data-v="${esc(c)}">${x(T.quisiste)} <u>${esc(c)}</u>?</button>`
          : '';
      }

      /* ---------- De qué pantalla se trata ---------- */
      function donde() {
        const s = S().pantalla;
        let m;
        if ((m = /^paso-(\d+)$/.exec(s))) {
          const i = Math.min(Number(m[1]), A().pasos.length) - 1;
          return {
            clase: 'paso',
            i,
            total: A().pasos.length,
            paso: P[A().pasos[i]],
            llave: A().pasos[i],
          };
        }
        if ((m = /^tarea-([a-z]+)-(\d+)$/.exec(s))) {
          const tarea = A().tareas.find((t) => t.id === m[1] && t.pasos);
          if (tarea) {
            const i = Math.min(Number(m[2]), tarea.pasos.length) - 1;
            return {
              clase: 'tarea',
              tarea,
              i,
              total: tarea.pasos.length,
              paso: tarea.pasos[i],
              llave: `${tarea.id}-${i + 1}`,
            };
          }
        }
        if (['entrar', 'dentro', 'papeles'].includes(s)) return { clase: s };
        if ((s === 'perfil' && E.app === 'driver') || (s === 'conductor' && E.app === 'cliente'))
          return { clase: s };
        return { clase: 'inicio' };
      }
      function ir(pantalla, editando = false) {
        S().pantalla = pantalla;
        S().editando = editando;
        ui = { idioma: false, ayuda: false, ojo: false, error: '', brindis: '' };
        recuperado[E.app] = false;
        guardar();
        pintar(true);
      }
      function atras() {
        const d = donde();
        if (['papeles', 'perfil', 'conductor'].includes(d.clase)) return ir('dentro');
        if (d.clase === 'paso' && S().editando && d.paso.tipo !== 'acepto')
          return ir(`paso-${d.total}`);
        if (d.clase === 'paso') return ir(d.i === 0 ? 'inicio' : `paso-${d.i}`);
        if (d.clase === 'tarea') return ir(d.i === 0 ? 'dentro' : `tarea-${d.tarea.id}-${d.i}`);
        if (d.clase === 'dentro') return ir(`paso-${A().pasos.length}`);
        return ir('inicio');
      }

      /* ---------- Piezas de pantalla ---------- */
      function selectorIdioma() {
        const bandera = E.lang === 'es' ? '🇪🇸' : '🇺🇸';
        const opcion = (cod, texto, b) =>
          `<label><input type="radio" name="idioma" value="${cod}" ${E.lang === cod ? 'checked' : ''} /> <span>${b}</span> ${texto}</label>`;
        return `<div class="idioma">
          <button type="button" data-a="idioma" aria-expanded="${ui.idioma}" aria-label="${x(T.cambiarIdioma)}">${bandera} ${E.lang.toUpperCase()} ${ICONO.flecha}</button>
          ${ui.idioma ? `<div class="ventana" role="dialog" aria-label="${x(T.cambiarIdioma)}"><b>${x(T.cambiarIdioma)}</b>${opcion('en', 'English - EN', '🇺🇸')}${opcion('es', 'español - ES', '🇪🇸')}</div>` : ''}
        </div>`;
      }
      const cabecera = (medio = '', conAtras = true) =>
        `<div class="cab">${conAtras ? `<button type="button" class="atras" data-a="atras" aria-label="${x(T.volver)}">${ICONO.atras}</button>` : ''}${medio}<span class="hueco"></span>${selectorIdioma()}</div>`;
      const enlaceAyuda = () =>
        `<button type="button" class="enlace suave" data-a="ayuda">${x(T.ayuda)}</button>`;
      const casilla = (id, marcada, html) =>
        `<div class="casilla"><button type="button" role="checkbox" aria-checked="${marcada}" data-a="casilla" data-id="${id}" aria-label="${esc(html.replace(/<[^>]+>/g, ''))}">${marcada ? ICONO.visto : ''}</button><div>${html}</div></div>`;

      function campo(paso, llave) {
        const v = S().v;
        const etq = `<label for="c">${x(paso.e)}</label>`;
        if (paso.tipo === 'correo')
          return `<div class="campo">${etq}<input id="c" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="${x(paso.ph)}" value="${esc(v[llave])}" /></div><div id="sug">${sugiereCorreo(v[llave])}</div>`;
        if (paso.tipo === 'texto')
          return `<div class="campo">${etq}<input id="c" type="text" ${paso.auto ? `autocomplete="${paso.auto}"` : 'autocomplete="off"'} ${paso.modo ? `inputmode="${paso.modo}"` : ''} ${paso.mayus ? 'autocapitalize="characters" style="text-transform:uppercase"' : ''} placeholder="${x(paso.ph)}" value="${esc(v[llave])}" /></div>`;
        if (paso.tipo === 'tel')
          return `<div class="campo">${etq}<div class="fila"><input class="pref" id="pref" type="tel" aria-label="+" value="${esc(v[`${llave}-pref`] ?? prefijo())}" /><input id="c" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="${x(paso.ph)}" value="${esc(v[llave])}" /></div></div>
            ${casilla('sms', Boolean(v.sms), `${x(T.sms)}<div class="pista">${x(T.smsNota)}</div>`)}`;
        if (paso.tipo === 'clave')
          return `<div class="campo">${etq}<div class="conojo"><input id="c" type="${ui.ojo ? 'text' : 'password'}" autocomplete="new-password" placeholder="${x(paso.ph)}" value="${esc(claves[E.app])}" /><button type="button" data-a="ojo" aria-label="${x(ui.ojo ? T.ocultar : T.ver)}">${ui.ojo ? ICONO.ojoNo : ICONO.ojo}</button></div></div>`;
        if (paso.tipo === 'fecha')
          return `<div class="campo">${etq}<input id="c" type="text" inputmode="numeric" autocomplete="bday" maxlength="10" placeholder="${moldeFecha()}" value="${esc(v[llave])}" data-fecha="1" /></div>`;
        if (paso.tipo === 'direccion') {
          const escrito = (v[llave] || '').trim();
          const lista = [
            L('Calle Principal 123', '123 Main Street'),
            L('Avenida Central 45', '45 Central Avenue'),
            L('Calle del Parque 8', '8 Park Street'),
          ];
          const sug =
            escrito.length >= 2 && !v[`${llave}-ok`]
              ? `<div class="sugerencias">${lista.map((s) => `<button type="button" data-a="sugerencia" data-v="${x(s)}">${ICONO.pin} ${x(s)} <small>${x(T.ejemplo)}</small></button>`).join('')}</div>`
              : `<div class="sugerencias"><button type="button" data-a="sugerencia" data-v="${x(lista[0])}">${ICONO.pin} ${x(T.ubicacion)}</button></div>`;
          return `<div class="campo">${etq}<input id="c" type="text" autocomplete="street-address" placeholder="${x(paso.ph)}" value="${esc(v[llave])}" data-dir="1" /></div>${sug}`;
        }
        if (paso.tipo === 'opciones')
          return `<div class="chips">${paso.ops.map((o, i) => `<button type="button" data-a="opcion" data-i="${i}" aria-pressed="${Boolean((v[llave] || [])[i])}"><i>${(v[llave] || [])[i] ? ICONO.visto : ''}</i>${x(o)}</button>`).join('')}</div>`;
        if (paso.tipo === 'foto') return asistenteFoto(paso, llave);
        if (paso.tipo === 'horas')
          return `<div class="fila"><div class="campo" style="flex:1"><label for="h1">${x(T.abre)}</label><input id="h1" type="time" value="${esc(v[`${llave}-a`] || '09:00')}" /></div><div class="campo" style="flex:1"><label for="h2">${x(T.cierra)}</label><input id="h2" type="time" value="${esc(v[`${llave}-c`] || '21:00')}" /></div></div>`;
        return '';
      }

      function pantallaPaso(d) {
        const { paso, llave } = d;
        if (paso.tipo === 'foto' && ui.cam) return pantallaCamara(d);
        const fotoSinUsar = paso.tipo === 'foto' && S().v[llave] !== true;
        const pct = Math.round(((d.i + 1) / d.total) * 100);
        const cuenta = `<span class="cuenta">${x(T.paso)} ${d.i + 1} ${x(T.de)} ${d.total}</span>`;
        let cuerpo;
        let boton = x(T.siguiente);
        if (paso.tipo === 'acepto') {
          const v = S().v;
          const datos = A()
            .pasos.map((id, i) => ({ id, i, p: P[id] }))
            .filter((f) => ['correo', 'texto', 'tel'].includes(f.p.tipo));
          const editar = (f) =>
            `<button type="button" class="editar" data-a="editar" data-p="paso-${f.i + 1}" aria-label="${x(T.cambiar)}: ${x(f.p.e)}">${x(T.cambiar)}</button>`;
          const elCorreo = datos.find((f) => f.p.tipo === 'correo');
          const grande = `<div class="correo-grande"><div class="arriba"><span>${x(T.tuCorreo)}</span>${editar(elCorreo)}</div><b data-correo>${esc(v[elCorreo.id]).replace('@', '<wbr />@') || '—'}</b><p>${x(T.bienEscrito)}</p>${sugiereCorreo(v[elCorreo.id])}</div>`;
          const filas = datos
            .filter((f) => f !== elCorreo)
            .map(
              (f) =>
                `<div><div><span>${x(f.p.e)}</span><b>${esc(f.p.tipo === 'tel' ? `${v[`${f.id}-pref`] ?? ''} ${v[f.id] ?? ''}` : v[f.id]) || '—'}</b></div>${editar(f)}</div>`,
            )
            .join('');
          const extra = A()
            .terminos.map((t) => `, <u>${x(t)}</u>`)
            .join('');
          cuerpo = `${grande}<div class="resumen">${filas}</div>
            ${casilla('acepto', S().acepto, `${x(T.acepto)} <u>${x(T.terminos)}</u>${extra} ${x(T.yLa)} <u>${x(T.privacidad)}</u>.`)}
            ${A().nota18 ? `<p class="pista">${E.lang === 'es' ? 'Para conducir o repartir debes tener la edad mínima que pide la ley donde trabajas, nunca menos de 18 años. Lo comprobamos con tu documento.' : 'To drive or deliver you must meet the legal minimum age where you work, never under 18. We confirm it with your ID.'}</p>` : ''}`;
          boton = x(T.crearMi);
        } else cuerpo = campo(paso, llave);
        const ultimoDeTarea = d.clase === 'tarea' && d.i === d.total - 1;
        if (ultimoDeTarea) boton = x(T.guardar);
        const editando = d.clase === 'paso' && S().editando && paso.tipo !== 'acepto';
        if (editando) boton = x(T.volverRevisar);
        return `${cabecera(cuenta)}
          <div class="progreso" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
          <div class="cuerpo" data-llave="${llave}">
            ${recuperado[E.app] ? `<div class="recuperado">${x(T.recuperado)} <button type="button" data-a="empezar">${x(T.empezar)}</button></div>` : ''}
            ${paso.tipo === 'foto' ? tiraDeFotos(d) : ''}
            <h1>${x(paso.t)}</h1><p class="ayuda">${x(paso.a)}</p>
            ${cuerpo}
            ${ui.error ? `<div class="error" role="alert">${esc(ui.error)}</div>` : ''}
          </div>
          <div class="pie">
            ${fotoSinUsar ? '' : `<button type="button" class="boton" data-a="siguiente">${boton}</button>`}
            ${paso.tipo === 'acepto' ? `<button type="button" class="boton borde" style="margin-top:10px" data-a="ir" data-p="paso-1">${x(T.editarDatos)}</button>` : ''}
            ${d.clase === 'tarea' && !ultimoDeTarea ? `<button type="button" class="enlace" data-a="ir" data-p="dentro">${x(T.guardarSeguir)}</button>` : ''}
            ${enlaceAyuda()}
          </div>`;
      }

      function pantallaInicio() {
        const a = A();
        return `<div class="cab" style="justify-content:flex-end">${selectorIdioma()}</div>
          <div class="portada"><img src="${a.logo}" alt="${a.nombre}" /><h1>${x(a.portada.t)}</h1><p>${x(a.portada.p)}</p></div>
          <div class="pie">
            <button type="button" class="boton" data-a="ir" data-p="paso-1">${x(T.crear)}</button>
            <button type="button" class="boton borde" style="margin-top:10px" data-a="ir" data-p="entrar">${x(T.yaTengo)}</button>
            ${a.portada.mirar ? `<button type="button" class="enlace" data-a="brindis">${x(T.mirar)}</button>` : ''}
            ${enlaceAyuda()}
          </div>`;
      }
      function pantallaEntrar() {
        return `${cabecera()}
          <div class="cuerpo"><h1>${x(T.entrar)}</h1><p class="ayuda">${A().nombre}</p>
            <div class="campo"><label for="c">${x(P.correo.e)}</label><input id="c" type="email" autocomplete="email" placeholder="${x(P.correo.ph)}" /></div>
            <div class="campo" style="margin-top:14px"><label for="c2">${x(P.clave.e)}</label><div class="conojo"><input id="c2" type="${ui.ojo ? 'text' : 'password'}" autocomplete="current-password" placeholder="${x(P.clave.ph)}" /><button type="button" data-a="ojo" aria-label="${x(ui.ojo ? T.ocultar : T.ver)}">${ui.ojo ? ICONO.ojoNo : ICONO.ojo}</button></div></div>
            <button type="button" class="enlace" style="text-align:left" data-a="brindis">${x(T.olvide)}</button>
          </div>
          <div class="pie"><button type="button" class="boton" data-a="brindis">${x(T.entrar)}</button>
            <button type="button" class="enlace" data-a="ir" data-p="paso-1">${x(T.noTengo)}</button>${enlaceAyuda()}</div>`;
      }
      /** Driver: con plazo de 30 días (Venezuela) o con los papeles antes del primer viaje. */
      const conPlazo = () =>
        E.modoDriver && E.modoDriver !== 'auto' ? E.modoDriver === 'plazo' : E.lang === 'es';
      function estadoTarea(t) {
        if (t.despues) return 'despues';
        return S().hechas[t.id] || '';
      }
      function pantallaDentro() {
        const a = A();
        const rec = S().recien;
        S().recien = null;
        const contables = a.tareas.filter((t) => !t.despues);
        const hechas = contables.filter((t) => estadoTarea(t)).length;
        const pct = Math.round((hechas / contables.length) * 100);
        const nombre = (S().v.nombre || '').trim().split(/\s+/)[0];
        const filas = a.tareas
          .map((t) => {
            const est = estadoTarea(t);
            const etiqueta =
              est === 'listo'
                ? T.listo
                : est === 'revision'
                  ? T.revision
                  : est === 'despues'
                    ? T.despues
                    : t.opcional
                      ? T.opcional
                      : T.pendiente;
            const punto =
              est === 'listo'
                ? ICONO.visto
                : est === 'revision' || est === 'despues'
                  ? ICONO.reloj
                  : '';
            return `<button type="button" class="tarea ${est} ${rec === t.id ? 'recien' : ''}" ${t.despues ? 'data-a="despues"' : `data-a="ir" data-p="tarea-${t.id}-1"`}><span class="punto">${punto}</span><div><b>${x(t.t)}</b><span>${x(t.a)}</span>${minisDeTarea(t)}</div><em>${x(etiqueta)}</em></button>`;
          })
          .join('');
        const exige = a.dentro.exige;
        const plazo = E.app === 'driver' && conPlazo();
        const puede = plazo || (exige ? exige.every((id) => S().hechas[id]) : !a.dentro.falta);
        const llaveCorreo = a.pasos.find((id) => P[id].tipo === 'correo');
        const correo = S().v[llaveCorreo];
        const arriba =
          (plazo ? `<div class="franja-ok"><b>${x(T.yaPuedes)}</b>${x(T.yaPuedesP)}</div>` : '') +
          (correo
            ? `<div class="recuperado">${x(T.activa)} <b style="overflow-wrap:anywhere">${esc(correo)}</b> ${x(T.activa2)}</div>`
            : '');
        return `<div class="cab color"><img src="${a.oscura ? 'img/logo-oscuro.svg' : 'img/logo-claro.svg'}" alt="${a.nombre}" style="height:26px" /><span class="hueco"></span>${selectorIdioma()}</div>
          ${tarjetaPerfil(hechas, contables.length, nombre)}
          <div class="dentro">${arriba}
            <div class="tarjeta"><h2>${x(plazo ? T.papeles : a.dentro.t)}</h2><p class="sub">${x(plazo ? T.papelesSub : a.dentro.sub)}</p>
              ${filas}
            </div>
            ${extrasDentro()}
          </div>
          <div class="pie">${!puede && a.dentro.falta ? `<p class="aviso">${x(a.dentro.falta)}</p>` : ''}<button type="button" class="boton ${puede ? '' : 'apagado'}" data-a="${puede ? 'brindis' : 'porque'}">${x(a.dentro.accion)}</button>${enlaceAyuda()}</div>`;
      }

      /* ---------- Los costados (solo del borrador, no son parte de la app) ---------- */
      const NOTAS = {

          L(

            'Password with a show/hide eye, back and help on every screen, no list of cities or countries.',

        ],
        decide: L('Decisiones de Richard', 'Decisions for Richard'),
        decideL: [
          L(
            'Entrar con un código en vez de contraseña: por mensaje de texto cuesta dinero cada vez; por correo es gratis. El borrador usa correo y contraseña, como hoy.',
            'Sign in with a code instead of a password: by text it costs money every time; by email it’s free. The draft uses email and password, as today.',

          L(

          ),
          L(

            'Restaurants get in with five fields and build the rest inside, or the team calls them before letting them in.',
          ),
          L(
            'La edad mínima y los documentos del conductor en cada país: es un tema legal.',
            'Minimum age and driver documents in each country: a legal matter.',
          ),
        ],
        modo: L('Driver: los papeles según el país', 'Driver: documents by country'),
        modoP: L(
          'El país sale de la cuenta, nunca de una lista. Aquí puedes ver los dos casos.',
          'The country comes from the account, never from a list. See both cases here.',
        ),
        modoAuto: L('Según el idioma', 'By language'),
        modoPlazo: L('Venezuela: 30 días', 'Venezuela: 30 days'),
        modoAntes: L(
          'Estados Unidos: antes del primer viaje',
          'United States: before the first trip',
        ),
        fecha: L('La fecha', 'The date'),
        fechaP: L(
          'El orden lo decide la región del teléfono. Aquí puedes probar los dos.',
          'The phone’s region decides the order. Try both here.',
        ),
        auto: L('Como este equipo', 'Like this device'),
        mda: L('Mes / día / año', 'Month / day / year'),
        dma: L('Día / mes / año', 'Day / month / year'),
        mapa: L('Pantallas', 'Screens'),
        antes: L('Antes de entrar', 'Before getting in'),
        adentro: L('Adentro', 'Inside'),
        intro: L(
          'Tócalo como si fuera la app. Es solo un borrador: no crea cuentas ni manda nada.',

        portada: L('Portada', 'Welcome'),
        lista: L('Lista para terminar', 'Checklist'),

      function pintarLados() {
        const a = A();
        const actual = S().pantalla;
        const fila = (p, n, texto) =>
          `<button type="button" data-a="ir" data-p="${p}" aria-current="${actual === p}"><span class="n">${n}</span>${texto}</button>`;
        let n = 0;
        const antes = [
          fila('inicio', ++n, x(NOTAS.portada)),
          ...a.pasos.map((id, i) => fila(`paso-${i + 1}`, ++n, x(P[id].t))),
        ].join('');
        const adentro = [
          fila('dentro', ++n, x(NOTAS.lista)),
          ...a.tareas
            .filter((t) => t.pasos)
            .flatMap((t) => t.pasos.map((p, i) => fila(`tarea-${t.id}-${i + 1}`, ++n, x(p.t)))),
          ...pantallasExtra().map(([p, t]) => fila(p, ++n, x(t))),
        ].join('');
        document.getElementById('lado-mapa').innerHTML =
          `<h2>${a.nombre}</h2><p>${x(NOTAS.intro)}</p>
          <div class="caja"><div class="mapa"><div class="sep" style="margin-top:0">${x(NOTAS.antes)}</div>${antes}<div class="sep">${x(NOTAS.adentro)}</div>${adentro}</div></div>`;
        const lista = (l) => `<ul>${l.map((i) => `<li>${x(i)}</li>`).join('')}</ul>`;
        const orden = (v, t) =>
          `<button type="button" data-a="orden" data-v="${v}" aria-pressed="${E.orden === v}">${x(t)}</button>`;
        document.getElementById('lado-notas').innerHTML =
          `<div class="caja"><h2>${x(NOTAS.cambia)}</h2>${lista(NOTAS.cambiaL)}</div>
          <div class="caja"><h2>${x(NOTAS.fijo)}</h2>${lista(NOTAS.fijoL)}</div>
          ${controlesBorrador()}
          <div class="caja"><h2>${x(NOTAS.decide)}</h2>${lista(NOTAS.decideL)}</div>
          ${
            E.app === 'driver'
              ? `<div class="caja"><h2>${x(NOTAS.modo)}</h2><p style="margin:0">${x(NOTAS.modoP)}</p><div class="orden">${orden(
                  'auto',
                  NOTAS.modoAuto,
                )
                  .replace('data-a="orden"', 'data-a="modo"')
                  .replace(
                    /aria-pressed="[a-z]+"/,
                    `aria-pressed="${(E.modoDriver || 'auto') === 'auto'}"`,
                  )}${orden('plazo', NOTAS.modoPlazo)
                  .replace('data-a="orden"', 'data-a="modo"')
                  .replace(
                    /aria-pressed="[a-z]+"/,
                    `aria-pressed="${E.modoDriver === 'plazo'}"`,
                  )}${orden('antes', NOTAS.modoAntes)
                  .replace('data-a="orden"', 'data-a="modo"')
                  .replace(
                    /aria-pressed="[a-z]+"/,
                    `aria-pressed="${E.modoDriver === 'antes'}"`,
                  )}</div></div>`
              : ''
          }
          <div class="caja"><h2>${x(NOTAS.fecha)}</h2><p style="margin:0">${x(NOTAS.fechaP)}</p><div class="orden">${orden('auto', NOTAS.auto)}${orden('mda', NOTAS.mda)}${orden('dma', NOTAS.dma)}</div></div>`;
        document.getElementById('b-titulo').textContent = `Divoox · ${x(T.titulo)}`;
        document.getElementById('b-reiniciar').textContent = x(T.reiniciar);
        document.getElementById('b-apps').innerHTML = ORDEN_APPS.map(
          (id) =>
            `<button type="button" data-app="${id}" aria-pressed="${E.app === id}">${APPS[id].nombre.replace('Divoox ', '') === 'Divoox' ? 'Divoox' : APPS[id].nombre.replace('Divoox ', '')}</button>`,
        ).join('');
        document.documentElement.lang = E.lang;
        document.title = `Divoox · ${x(T.titulo)}`;
      }

      function pintar(enfocar) {
        const d = donde();
        const a = A();
        const p = document.getElementById('p');
        document.documentElement.style.setProperty('--app', a.color);
        p.className = `pantalla ${d.clase === 'inicio' && a.oscura ? 'oscura' : ''} ${a.oscura ? '' : 'clara'}`;
        let html =
          d.clase === 'paso' || d.clase === 'tarea'
            ? pantallaPaso(d)
            : d.clase === 'entrar'
              ? pantallaEntrar()
              : d.clase === 'dentro'
                ? pantallaDentro()
                : d.clase === 'papeles'
                  ? pantallaPapeles()
                  : d.clase === 'perfil'
                    ? pantallaPerfil()
                    : d.clase === 'conductor'
                      ? pantallaConductor()
                      : pantallaInicio();
        if (ui.ayuda)
          html += `<div class="hoja" data-a="cerrar-ayuda"><div role="dialog" aria-label="${x(T.ayudaT)}"><h2>${x(T.ayudaT)}</h2><p>${x(T.ayudaP)}</p>
            <button type="button" class="boton" data-a="brindis">${x(T.ayudaChat)}</button><button type="button" class="boton borde" data-a="brindis">${x(T.ayudaDocs)}</button>
            <button type="button" class="enlace" data-a="cerrar-ayuda">${x(T.cerrar)}</button></div></div>`;
        if (ui.brindis) html += `<div class="brindis" role="status">${esc(ui.brindis)}</div>`;
        p.innerHTML = html;
        // El anillo del perfil avanza a la vista, desde donde estaba.
        requestAnimationFrame(() =>
          p
            .querySelectorAll('[data-off]')
            .forEach((c) => (c.style.strokeDashoffset = c.dataset.off)),
        );
        pintarLados();
        if (enfocar === 'siempre' || (enfocar && matchMedia('(min-width: 781px)').matches)) {
          const c = document.getElementById('c');
          if (c) {
            c.focus({ preventScroll: true });
            const largo = c.value.length;
            try {
              c.setSelectionRange(largo, largo);
            } catch {
              /* el correo no deja mover el cursor */
            }
          }
        }
      }

      /* ---------- Lo que pasa al tocar ---------- */
      function siguiente() {
        const d = donde();
        if (d.clase !== 'paso' && d.clase !== 'tarea') return;
        const { paso, llave } = d;
        const v = S().v;
        const opcional = d.clase === 'tarea' && (d.tarea.opcional || paso.libre);
        const falla = (m) => {
          ui.error = x(m);
          pintar(true);
        };
        const escrito = (v[llave] || '').toString().trim();
        if (paso.tipo === 'acepto') {
          if (!S().acepto) return falla(T.marca);
          return ir('dentro');
        }
        if (paso.tipo === 'correo' && !correoValido(escrito))
          return falla(escrito ? T.correoMal : T.falta);
        if (paso.tipo === 'clave' && (claves[E.app] || '').length < 8) return falla(T.claveCorta);
        if (['texto', 'tel', 'direccion'].includes(paso.tipo) && !escrito && !opcional)
          return falla(T.falta);
        if (paso.tipo === 'tel' && escrito && escrito.replace(/\D/g, '').length < 7)
          return falla(T.falta);
        if (paso.tipo === 'fecha' && (escrito || !opcional)) {
          const f = fechaEscrita(escrito);
          if (!f) return falla(escrito ? T.fechaMal : T.falta);
          const hace18 = new Date();
          hace18.setFullYear(hace18.getFullYear() - 18);
          if (paso.mayor && f > hace18) return falla(T.menor);
        }
        if (paso.tipo === 'opciones' && !(v[llave] || []).some(Boolean)) return falla(T.elige);
        if (paso.tipo === 'foto' && v[llave] !== true && !opcional) return falla(T.faltaFoto);
        if (d.clase === 'paso') return ir(`paso-${S().editando ? d.total : d.i + 2}`);
        if (d.i < d.total - 1) return ir(`tarea-${d.tarea.id}-${d.i + 2}`);
        S().hechas[d.tarea.id] = d.tarea.fin || 'listo';
        S().recien = d.tarea.id;
        ir(despuesDeTarea(d.tarea));
      }
      function brindis(texto) {
        ui.brindis = texto;
        ui.ayuda = false;
        pintar();
        clearTimeout(brindis.t);
        brindis.t = setTimeout(() => {
          ui.brindis = '';
          pintar();
        }, 2600);
      }
      document.addEventListener('click', (ev) => {
        const app = ev.target.closest('[data-app]');
        if (app) {
          E.app = app.dataset.app;
          ui = { idioma: false, ayuda: false, ojo: false, error: '', brindis: '' };
          guardar();
          return pintar(true);
        }
        if (ev.target.closest('#b-reiniciar')) {
          for (const a of ORDEN_APPS) {
            E.apps[a] = nuevoDeApp();
            delete claves[a];
            recuperado[a] = false;
          }
          return ir('inicio');
        }
        const b = ev.target.closest('[data-a]');
        if (ui.idioma && !ev.target.closest('.idioma')) {
          ui.idioma = false;
          if (!b) return pintar();
        }
        if (!b) return;
        const acc = b.dataset.a;
        const d = donde();
        const v = S().v;
        if (acc === 'idioma') {
          ui.idioma = !ui.idioma;
          return pintar();
        }
        if (acc === 'atras') return atras();
        if (acc === 'siguiente') return siguiente();
        if (acc === 'ir') return ir(b.dataset.p);
        if (acc === 'editar') return ir(b.dataset.p, true);
        if (acc === 'corregir') {
          const llaveCorreo = A().pasos.find((id) => P[id].tipo === 'correo');
          v[llaveCorreo] = b.dataset.v;
          guardar();
          return pintar(true);
        }
        if (acc === 'modo') {
          E.modoDriver = b.dataset.v;
          guardar();
          return pintar();
        }
        if (acc === 'ojo') {
          ui.ojo = !ui.ojo;
          return pintar(true);
        }
        if (acc === 'ayuda') {
          ui.ayuda = true;
          return pintar();
        }
        if (acc === 'cerrar-ayuda') {
          if (ev.target !== b && !ev.target.closest('.enlace')) return;
          ui.ayuda = false;
          return pintar();
        }
        if (acc === 'casilla') {
          if (b.dataset.id === 'acepto') S().acepto = !S().acepto;
          else v[b.dataset.id] = !v[b.dataset.id];
          ui.error = '';
          guardar();
          return pintar();
        }
        if (acc === 'opcion') {
          const lista = (v[d.llave] = v[d.llave] || []);
          lista[Number(b.dataset.i)] = !lista[Number(b.dataset.i)];
          ui.error = '';
          guardar();
          return pintar();
        }
        if (acc === 'foto-camara') {
          ui.cam = true;
          ui.error = '';
          return pintar();
        }
        if (acc === 'cam-cerrar') {
          ui.cam = false;
          return pintar();
        }
        if (acc === 'foto-disparo') {
          v[d.llave] = 'prueba';
          ui.cam = false;
          ui.error = '';
          ui.aviso = E.prueba || '';
          guardar();
          return pintar();
        }
        if (acc === 'foto-repetir') {
          // «Repetir» vuelve siempre a la cámara.
          delete v[d.llave];
          ui.aviso = '';
          ui.cam = true;
          ui.error = '';
          guardar();
          return pintar();
        }
        if (acc === 'foto-usar') {
          v[d.llave] = true;
          ui.aviso = '';
          guardar();
          return siguiente();
        }
        if (acc === 'enviar') {
          ir('dentro');
          return brindis(x(TX.enviado));
        }
        if (acc === 'faltan') return brindis(x(TX.faltan));
        if (acc === 'prueba' || acc === 'variante' || acc === 'trayectoria') {
          E[acc === 'variante' ? 'perfil' : acc] = b.dataset.v;
          guardar();
          return pintar();
        }
        if (acc === 'sugerencia') {
          v[d.llave] = b.dataset.v;
          v[`${d.llave}-ok`] = true;
          ui.error = '';
          guardar();
          return pintar(true);
        }
        if (acc === 'empezar') {
          E.apps[E.app] = nuevoDeApp();
          delete claves[E.app];
          return ir('paso-1');
        }
        if (acc === 'orden') {
          E.orden = b.dataset.v;
          guardar();
          return pintar();
        }
        if (acc === 'brindis') return brindis(x(T.borrador));
        if (acc === 'porque') return brindis(x(A().dentro.falta));
        if (acc === 'despues')
          return brindis(
            x(
              b.querySelector('span:not(.punto)')
                ? A().tareas.find((t) => t.despues).a
                : T.borrador,
            ),
          );
      });
      document.addEventListener('change', (ev) => {
        if (ev.target.name === 'idioma') {
          E.lang = ev.target.value;
          ui.idioma = false;
          ui.error = '';
          guardar();
          pintar();
        }
      });
      document.addEventListener('input', (ev) => {
        const d = donde();
        const t = ev.target;
        if (d.clase !== 'paso' && d.clase !== 'tarea') return;
        const v = S().v;
        if (t.id === 'c') {
          if (d.paso.tipo === 'clave') claves[E.app] = t.value;
          else if (t.dataset.fecha) {
            t.value = escribirFecha(t.value, v[d.llave] || '');
            v[d.llave] = t.value;
          } else if (t.dataset.dir) {
            v[d.llave] = t.value;
            v[`${d.llave}-ok`] = false;
            guardar();
            return pintar('siempre');
          } else {
            // Cada casilla acepta solo lo suyo: lo que no corresponde ni siquiera se escribe.
            let limpio = t.value;
            if (d.paso.tipo === 'correo') limpio = limpio.replace(/\s/g, '').toLowerCase();
            else if (d.paso.tipo === 'tel') limpio = limpio.replace(/\D/g, '');
            else if (d.paso.solo === 'letras') limpio = limpio.replace(/[^\p{L}\s.'’-]/gu, '');
            else if (d.paso.mayus) limpio = limpio.toUpperCase().replace(/[^A-Z0-9-]/g, '');
            else if (d.paso.modo === 'decimal') limpio = limpio.replace(/[^\d.,]/g, '');
            if (limpio !== t.value) t.value = limpio;
            v[d.llave] = limpio;
            if (d.paso.tipo === 'correo')
              document.getElementById('sug').innerHTML = sugiereCorreo(limpio);
          }
        } else if (t.id === 'pref') {
          t.value = `+${t.value.replace(/\D/g, '').slice(0, 4)}`;
          v[`${d.llave}-pref`] = t.value;
        } else if (t.id === 'h1') v[`${d.llave}-a`] = t.value;
        else if (t.id === 'h2') v[`${d.llave}-c`] = t.value;
        else return;
        if (ui.error) {
          ui.error = '';
          const e = document.querySelector('#p .error');
          if (e) e.remove();
        }
        // El borrador se guarda solo, con un respiro de medio segundo.
        clearTimeout(guardar.t);
        guardar.t = setTimeout(guardar, 500);
      });
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape' && (ui.idioma || ui.ayuda)) {
          ui.idioma = false;
          ui.ayuda = false;
          return pintar();
        }
        if (ev.key === 'Enter' && ev.target.tagName === 'INPUT' && ev.target.closest('#p')) {
          ev.preventDefault();
          siguiente();
        }
      });
      addEventListener('hashchange', () => {
        leerDireccion();
        pintar(true);
      });
      guardar();
      pintar(true);
    </script>
