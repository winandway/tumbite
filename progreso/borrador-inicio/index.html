<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Divoox · Borrador del inicio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rojo: #f20d20;
        --rojo-osc: #c20a1a;
        --rojo-suave: #fdecee;
        --negro: #101010;
        --gris: #666b73;
        --gris-2: #9a9ea5;
        --borde: #e6e7ea;
        --fondo: #f6f6f6;
        --blanco: #ffffff;
        --verde: #0d7a3a;
        --verde-suave: #e6f2ea;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: #ecedef;
        color: var(--negro);
        font-family: Montserrat, system-ui, sans-serif;
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-align: left;
      }
      h1,
      h2,
      h3 {
        font-family: Poppins, system-ui, sans-serif;
        margin: 0;
      }
      .pagina {
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px 16px 48px;
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 32px;
        align-items: start;
      }
      .lateral h1 {
        font-size: 22px;
        line-height: 1.25;
      }
      .lateral p {
        color: var(--gris);
        line-height: 1.5;
        margin: 8px 0 14px;
        font-size: 14px;
      }
      .nota {
        border: 1px solid var(--borde);
        background: #fff;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 13px;
        color: var(--gris);
        line-height: 1.45;
      }
      .lista {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 14px 0;
      }
      .lista button {
        border: 1px solid var(--borde);
        background: #fff;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 600;
        font-size: 14px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .lista .n {
        width: 24px;
        height: 24px;
        border-radius: 12px;
        background: var(--fondo);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        flex: none;
      }
      .lista button[aria-current='true'] {
        border-color: var(--negro);
      }
      .lista button[aria-current='true'] .n {
        background: var(--negro);
        color: #fff;
      }
      .toques {
        margin-top: 12px;
        border: 1px solid var(--borde);
        background: #fff;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.45;
      }
      .toques b {
        color: var(--verde);
      }
      .escenario {
        display: flex;
        justify-content: center;
        position: sticky;
        top: 16px;
      }
      .telefono {
        width: 390px;
        height: 844px;
        background: var(--blanco);
        border-radius: 46px;
        border: 10px solid #111;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      }
      body.captura {
        background: #fff;
      }
      body.captura .pagina {
        display: block;
        padding: 0;
        max-width: none;
      }
      body.captura .lateral {
        display: none;
      }
      body.captura .escenario {
        position: static;
        justify-content: flex-start;
      }
      body.captura .telefono {
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      @media (max-width: 840px) {
        .pagina {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .escenario {
          position: static;
        }
        .telefono {
          width: 100%;
          max-width: 390px;
          height: 800px;
          border-width: 8px;
          border-radius: 38px;
        }
      }
      .idioma {
        position: relative;
      }
      .idioma-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 18px;
        border: 1px solid var(--borde);
        background: #fff;
      }
      .idioma.abierto .idioma-btn,
      .idioma-btn:hover {
        border-color: var(--negro);
      }
      .idioma-menu {
        display: none;
        position: absolute;
        right: 0;
        top: calc(100% + 10px);
        background: #fff;
        border: 1px solid #d5d9d9;
        border-radius: 8px;
        box-shadow: 0 2px 10px rgba(15, 17, 17, 0.15);
        width: 210px;
        padding: 12px 14px;
        z-index: 40;
      }
      .idioma.abierto .idioma-menu {
        display: block;
      }
      .idioma-menu:before {
        content: '';
        position: absolute;
        top: -7px;
        right: 18px;
        width: 12px;
        height: 12px;
        background: #fff;
        border-left: 1px solid #d5d9d9;
        border-top: 1px solid #d5d9d9;
        transform: rotate(45deg);
      }
      .idioma-menu .tit {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .idioma-op {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 0;
        font-size: 14px;
      }
      .idioma-op + .idioma-op {
        border-top: 1px solid #e7e7e7;
      }
      .radio {
        width: 16px;
        height: 16px;
        border-radius: 8px;
        border: 1px solid #888c8c;
        display: grid;
        place-items: center;
        flex: none;
      }
      .radio.si {
        border-color: #e77600;
      }
      .radio.si:after {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background: #e77600;
      }
      .bandera {
        width: 20px;
        height: 14px;
        border-radius: 2px;
        flex: none;
        display: block;
      }
      .estado {
        height: 46px;
        flex: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 28px;
        font-size: 14px;
        font-weight: 600;
      }
      .pantalla {
        display: none;
        flex: 1;
        min-height: 0;
        flex-direction: column;
        position: relative;
      }
      .pantalla.activa {
        display: flex;
      }
      .desliza {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: none;
      }
      .desliza::-webkit-scrollbar {
        display: none;
      }
      .cab {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 16px 8px;
      }
      .cab img {
        height: 28px;
      }
      .cab-der {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .circ {
        width: 38px;
        height: 38px;
        border-radius: 19px;
        border: 1px solid var(--borde);
        display: grid;
        place-items: center;
        background: #fff;
        position: relative;
      }
      .circ .punto {
        position: absolute;
        top: 8px;
        right: 9px;
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background: var(--rojo);
        border: 2px solid #fff;
      }
      .saludo {
        padding: 6px 16px 0;
      }
      .saludo h1 {
        font-size: 24px;
        line-height: 1.2;
      }
      .saludo p {
        margin: 2px 0 0;
        color: var(--gris);
        font-size: 14px;
      }
      .buscar {
        margin: 12px 16px 0;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--fondo);
        border-radius: 14px;
        padding: 13px 14px;
        color: var(--gris);
        font-size: 14px;
        width: calc(100% - 32px);
      }
      .grilla {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 14px 16px 0;
      }
      .serv {
        background: #fff;
        border: 1px solid var(--borde);
        border-radius: 16px;
        height: 96px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        position: relative;
      }
      .serv:active {
        transform: scale(0.97);
      }
      .serv img {
        height: 48px;
        max-width: 70px;
        object-fit: contain;
      }
      .serv span {
        font-size: 13px;
        font-weight: 700;
        text-align: center;
        line-height: 1.1;
      }
      .serv small {
        display: block;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--gris);
      }
      .mas4 {
        width: 44px;
        height: 44px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .mas4 i {
        border-radius: 6px;
        background: var(--rojo);
      }
      .mas4 i:nth-child(2) {
        background: #101010;
      }
      .mas4 i:nth-child(3) {
        background: #d6d8dc;
      }
      .mas4 i:nth-child(4) {
        background: var(--rojo-osc);
      }
      .orden {
        padding: 12px 16px 0;
        font-size: 12px;
        color: var(--gris);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .oferta {
        margin: 16px 16px 0;
        height: 104px;
        border-radius: 16px;
        background: var(--rojo);
        color: #fff;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 16px;
        width: calc(100% - 32px);
      }
      .oferta img {
        position: absolute;
        right: -30px;
        top: 0;
        height: 104px;
        width: 230px;
        object-fit: cover;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 35%);
        mask-image: linear-gradient(90deg, transparent, #000 35%);
      }
      .oferta b {
        font-family: Poppins;
        font-size: 13px;
        opacity: 0.9;
        position: relative;
      }
      .oferta strong {
        font-family: Poppins;
        font-size: 20px;
        line-height: 1.15;
        position: relative;
        max-width: 200px;
      }
      .oferta .cod {
        position: relative;
        margin-top: 8px;
        align-self: flex-start;
        background: #fff;
        color: var(--negro);
        border-radius: 12px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 700;
      }
      .sec {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 20px 16px 10px;
      }
      .sec h2 {
        font-size: 18px;
      }
      .sec a {
        font-size: 13px;
        font-weight: 700;
        color: var(--negro);
        text-decoration: none;
      }
      .carril {
        display: flex;
        gap: 10px;
        padding: 0 16px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .carril::-webkit-scrollbar {
        display: none;
      }
      .rest {
        flex: none;
        width: 156px;
        border: 1px solid var(--borde);
        border-radius: 14px;
        overflow: hidden;
        background: #fff;
      }
      .rest img {
        width: 100%;
        height: 92px;
        object-fit: cover;
        display: block;
      }
      .rest div {
        padding: 8px 10px 10px;
      }
      .rest b {
        display: block;
        font-size: 13.5px;
      }
      .rest span {
        font-size: 12px;
        color: var(--gris);
      }
      .estrella {
        color: #b57f00;
      }
      .barra {
        flex: none;
        height: 78px;
        border-top: 1px solid var(--borde);
        display: flex;
        justify-content: space-around;
        align-items: flex-start;
        padding-top: 8px;
        background: #fff;
      }
      .barra button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--gris);
        width: 66px;
        padding: 4px 0;
      }
      .barra button.on {
        color: var(--rojo-osc);
      }
      .tope {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 12px 8px;
        flex: none;
      }
      .tope h1 {
        font-size: 19px;
        flex: 1;
        text-align: center;
        margin-right: 40px;
      }
      .atras {
        width: 40px;
        height: 40px;
        border-radius: 20px;
        display: grid;
        place-items: center;
      }
      .heroe {
        margin: 0 16px;
        border-radius: 18px;
        background: var(--fondo);
        height: 132px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        overflow: hidden;
        position: relative;
      }
      .heroe img {
        height: 100px;
        max-width: 150px;
        object-fit: contain;
      }
      .heroe .tx {
        text-align: right;
        max-width: 175px;
      }
      .heroe h2 {
        font-size: 21px;
        line-height: 1.15;
      }
      .heroe p {
        margin: 4px 0 0;
        color: var(--gris);
        font-size: 13px;
        line-height: 1.35;
      }
      .heroe.foto {
        background: #1b1b1b;
        color: #fff;
        height: 140px;
      }
      .heroe.foto img {
        position: absolute;
        right: 0;
        top: 0;
        height: 140px;
        width: 220px;
        max-width: none;
        object-fit: cover;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%);
        mask-image: linear-gradient(90deg, transparent, #000 40%);
      }
      .heroe.foto .tx {
        text-align: left;
        position: relative;
      }
      .heroe.foto p {
        color: #d6d8dc;
      }
      .cuerpo {
        padding: 12px 16px 16px;
      }
      .segmento {
        display: flex;
        background: var(--fondo);
        border-radius: 12px;
        padding: 4px;
        gap: 4px;
      }
      .segmento button {
        flex: 1;
        text-align: center;
        border-radius: 9px;
        padding: 9px 6px;
        font-weight: 700;
        font-size: 13.5px;
        color: var(--gris);
      }
      .segmento button.on {
        background: var(--rojo);
        color: #fff;
      }
      .ruta {
        margin-top: 12px;
        border: 1px solid var(--borde);
        border-radius: 14px;
        position: relative;
      }
      .ruta .linea {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        width: 100%;
      }
      .ruta .linea + .linea {
        border-top: 1px solid var(--borde);
      }
      .ruta .et {
        display: block;
        font-size: 12px;
        color: var(--gris);
        font-weight: 600;
      }
      .ruta .vl {
        display: block;
        font-size: 14.5px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ruta .vl.vacio {
        color: var(--gris);
        font-weight: 500;
      }
      .ruta .linea > span:nth-child(2) {
        flex: 1;
        min-width: 0;
      }
      .ruta .hilo {
        position: absolute;
        left: 21px;
        top: 36px;
        bottom: 36px;
        border-left: 2px dotted #c9ccd1;
      }
      .ico-o {
        width: 16px;
        height: 16px;
        border-radius: 8px;
        border: 4px solid var(--negro);
        flex: none;
        background: #fff;
        position: relative;
        z-index: 1;
      }
      .ico-d {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        background: var(--rojo);
        flex: none;
        position: relative;
        z-index: 1;
      }
      .centrar {
        width: 36px;
        height: 36px;
        border-radius: 18px;
        background: var(--fondo);
        display: grid;
        place-items: center;
        flex: none;
      }
      .atajos {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .atajos::-webkit-scrollbar {
        display: none;
      }
      .atajo {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--borde);
        border-radius: 18px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        flex: none;
        background: #fff;
      }
      .atajo.on {
        border-color: var(--negro);
        background: var(--negro);
        color: #fff;
      }
      .atajo.on svg {
        stroke: #fff;
      }
      .sub {
        font-family: Poppins;
        font-size: 15.5px;
        font-weight: 600;
        margin: 16px 0 8px;
      }
      .tipo {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--borde);
        border-radius: 14px;
        padding: 10px 12px;
        width: 100%;
        background: #fff;
      }
      .tipo + .tipo {
        margin-top: 8px;
      }
      .tipo.sel {
        border: 2px solid var(--rojo);
        padding: 9px 11px;
      }
      .tipo img {
        width: 62px;
        height: 44px;
        object-fit: contain;
        flex: none;
      }
      .tipo .tx {
        flex: 1;
      }
      .tipo .tx b {
        display: block;
        font-size: 14.5px;
      }
      .tipo .tx span {
        font-size: 12px;
        color: var(--gris);
      }
      .tipo .pr {
        font-weight: 700;
        font-size: 14px;
        text-align: right;
        white-space: nowrap;
      }
      .tipo .pr small {
        display: block;
        font-weight: 500;
        font-size: 11.5px;
        color: var(--gris);
      }
      .tarifa {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--fondo);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 12px;
      }
      .tarifa span {
        font-size: 13px;
        color: var(--gris);
        font-weight: 600;
      }
      .tarifa b {
        font-family: Poppins;
        font-size: 19px;
      }
      .pago {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--gris);
        margin: 10px 2px 0;
      }
      .pie {
        flex: none;
        padding: 10px 16px 18px;
        background: #fff;
        border-top: 1px solid var(--borde);
      }
      .boton {
        display: block;
        width: 100%;
        background: var(--rojo);
        color: #fff;
        border-radius: 14px;
        padding: 16px;
        text-align: center;
        font-family: Poppins;
        font-weight: 700;
        font-size: 17px;
      }
      .boton:hover {
        background: var(--rojo-osc);
      }
      .boton.claro {
        background: #fff;
        color: var(--negro);
        border: 1px solid var(--negro);
      }
      .campo {
        border: 1px solid var(--borde);
        border-radius: 12px;
        padding: 12px 14px;
        color: var(--gris);
        font-size: 14px;
      }
      .fila-tipo {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--borde);
        border-radius: 14px;
        padding: 10px 12px;
        width: 100%;
      }
      .fila-tipo img {
        width: 44px;
        height: 40px;
        object-fit: contain;
      }
      .fila-tipo .tx {
        flex: 1;
      }
      .fila-tipo b {
        display: block;
        font-size: 14px;
      }
      .fila-tipo span {
        font-size: 12px;
        color: var(--gris);
      }
      .entrada {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 2px solid var(--negro);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 15px;
        font-weight: 600;
      }
      .cursor {
        display: inline-block;
        width: 2px;
        height: 18px;
        background: var(--negro);
        vertical-align: -3px;
        animation: parpadeo 1s steps(1) infinite;
      }
      @keyframes parpadeo {
        50% {
          opacity: 0;
        }
      }
      .fijar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 2px;
        width: 100%;
        color: var(--rojo-osc);
        font-weight: 700;
        font-size: 14px;
        border-bottom: 1px solid var(--borde);
      }
      .fijar .fl {
        margin-left: auto;
      }
      .lista-sug .fila {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        width: 100%;
      }
      .lista-sug .fila + .fila {
        border-top: 1px solid var(--borde);
      }
      .lista-sug .ic {
        width: 38px;
        height: 38px;
        border-radius: 19px;
        background: var(--fondo);
        display: grid;
        place-items: center;
        flex: none;
      }
      .lista-sug b {
        display: block;
        font-size: 14.5px;
      }

        const ruta = `<svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 390 360"><path d="M80 260 C130 240 140 160 200 150 S290 110 300 80" fill="none" stroke="#101010" stroke-width="5" stroke-linecap="round"/><circle cx="300" cy="80" r="8" fill="#fff" stroke="#101010" stroke-width="5"/></svg>`;
        document.querySelector('[data-p=seguimiento]').innerHTML =
          `${mapa(360, ruta + motito(66, 244))}
   <button class="flotante" data-ir="inicio" aria-label="Inicio">${I(P.atras, 22)}</button>
   <div class="hoja"><div class="agarre"></div>
    <div class="franja-verde">${I(P.check, 18, '#0D7A3A', 2.6)}${t.enCamino} · ${t.llega}</div>
    <div class="conductor"><span class="avatar">CE</span><span class="tx"><b>${t.conductorNom}</b><span>${t.motoRoja}</span></span><span class="placa">${t.placaEj}</span></div>
    <div class="acciones"><button>${I(P.tel, 20)}${t.llamar}</button><button>${I(P.chat, 20)}${t.mensaje}</button><button>${I(P.compartir, 20)}${t.compartirV}</button></div>
    <div class="resumen"><img src="img/moto.webp" alt=""><div><b>${t.deA}</b><span>${t.precioRes}</span></div></div>
    <button class="boton claro" style="display:flex;gap:8px;justify-content:center;align-items:center">${I(P.escudo, 18)}${t.seguridad}</button>
   </div>`;

        document
          .querySelectorAll('.pantalla')
          .forEach((s) => s.classList.toggle('activa', s.dataset.p === E.P));
        document.querySelectorAll('.pantalla.activa .idioma-app').forEach(selector);
        conectar();
      }
      function abrirVelo() {
        const t = T[E.L];
        const ic = [P.regalo, P.repetir, P.escudo, P.paquete];
        const v = document.getElementById('velo');
        v.innerHTML = `<div class="h"><div class="agarre"></div><h2>${t.masTit}</h2>${t.masItems.map((m, i) => `<button class="f"><span class="ic">${I(ic[i], 18)}</span>${m}<span>${I(P.flecha, 16, '#666B73')}</span></button>`).join('')}</div>`;
        v.querySelector('.h').onclick = (e) => e.stopPropagation();
        v.classList.add('on');
        v.onclick = cerrarVelo;
      }
      function cerrarVelo() {
        document.getElementById('velo').classList.remove('on');
      }
      function conectar() {
        document.querySelectorAll('#telefono .pantalla.activa button').forEach((b) => {
          if (b.closest('.idioma')) return;
          b.onclick = (e) => {
            e.stopPropagation();
            window.__toques++;
            const d = b.dataset;
            if (d.velo) return abrirVelo();
            if (d.dest) E.destino = d.dest;
            if (d.cuando) E.ahora = d.cuando === '1';
            if (d.carro) E.carro = +d.carro;
            if (d.envio) E.envio = d.envio;
            if (d.cat) E.cat = +d.cat;
            if (d.filtro) E.filtro = E.filtro === +d.filtro ? -1 : +d.filtro;
            if (d.ir === 'envios-flex') {
              E.envio = 'flex';
              return ir('envios');
            }
            if (d.ir === 'envios') E.envio = 'express';
            if (d.ir === 'inicio') E.destino = null;
            if (d.ir) return ir(d.ir);
            if (d.dest || d.cuando || d.carro || d.envio || d.cat || d.filtro) ir(E.P);
          };
        });
        document.querySelectorAll('.lateral [data-lista]').forEach(
          (b) =>
            (b.onclick = () => {
              const p = b.dataset.lista;
              if (p === 'inicio' || p === 'usados' || p === 'moto') E.destino = null;
              ir(p);
            }),
        );
      }
      leerHash();
      pintar();
      window.addEventListener('hashchange', () => {
        leerHash();
        pintar();
      });
    </script>
  </body>
</html>
