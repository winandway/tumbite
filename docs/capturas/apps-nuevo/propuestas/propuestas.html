<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Divoox · Propuestas de diseño de las apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Montserrat, sans-serif; background: #ECECEC; color: #101010; padding: 40px; }
  h1 { font-family: Poppins; font-size: 34px; margin-bottom: 6px; }
  .sub { font-size: 17px; color: #666B73; margin-bottom: 28px; max-width: 1500px; }
  .fila { display: flex; gap: 28px; flex-wrap: nowrap; }
  .tel { width: 360px; height: 760px; background: var(--canvas); border-radius: 40px; overflow: hidden;
    border: 10px solid #101010; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,.18); flex: none; }
  .cap { font-family: Poppins; font-weight: 600; font-size: 15px; margin: 12px 0 0 6px; color: #101010; }
  .estado { height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 22px;
    font-size: 12px; font-weight: 700; color: var(--estadoColor); background: var(--headBg); }
  .t { font-family: Poppins; font-weight: 700; }
  .ico { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 17px;
    background: var(--chip); color: var(--chipText); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .chip.on { background: var(--chipOn); color: var(--chipOnText); }
  .btn { height: 52px; border-radius: 26px; background: var(--cta); color: #fff; font-family: Poppins; font-weight: 600;
    font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.sec { background: #fff; color: #101010; border: 1px solid #DADCE0; }
  .card { background: #fff; border-radius: var(--radio); border: var(--cardBorde); box-shadow: var(--sombra); }
  .muted { color: #666B73; }
  .verde { color: #0D7A3A; }
  .tab { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: #fff; border-top: 1px solid #ECECEC;
    display: flex; justify-content: space-around; padding-top: 10px; }
  .tab div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: #8A8F98; }
  .tab .on { color: var(--tabOn); }
  img.foto { width: 100%; object-fit: cover; display: block; }
  .bloque { margin-bottom: 56px; }
  .etiqueta { display: inline-block; font-family: Poppins; font-weight: 600; font-size: 13px; padding: 5px 12px; border-radius: 14px; background: #101010; color: #fff; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
const A = '../../../../apps/cliente/assets/inicio/';
const I = {
  casa: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  recibo: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  corazon: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  persona: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',
  lupa: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  campana: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  pin: '<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  flecha: '<path d="M15 5l-7 7 7 7"/>',
  abajo: '<path d="M6 9l6 6 6-6"/>',
  estrella: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  reloj: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  mas: '<path d="M12 5v14M5 12h14"/>',
  menos: '<path d="M5 12h14"/>',
  moto: '<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-3-7h3l3 7"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  chat: '<path d="M4 5h16v11H8l-4 4z"/>',
  tel: '<path d="M5 4h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a1 1 0 0 1-1 1A17 17 0 0 1 4 5a1 1 0 0 1 1-1z"/>',
  tienda: '<path d="M4 9l1-5h14l1 5M4 9h16v11H4zM9 20v-6h6v6"/>',
  grafica: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
};
const ic = (n, s = 22) => `<svg class="ico" style="width:${s}px;height:${s}px" viewBox="0 0 24 24">${I[n]}</svg>`;

const TEMAS = {
  A: { nombre: 'Propuesta A · Clara', desc: 'Fondo blanco, letra negra y el rojo solo para lo que se toca. Es el estándar de Uber Eats y DoorDash: la comida y las fotos mandan.',
    canvas: '#FFFFFF', headBg: '#FFFFFF', headText: '#101010', estadoColor: '#101010', chip: '#F3F3F3', chipText: '#101010', chipOn: '#101010', chipOnText: '#fff',
    cta: '#F20D20', tabOn: '#F20D20', radio: '14px', cardBorde: 'none', sombra: 'none', buscador: '#F3F3F3', driverHoja: '#FFFFFF', driverTexto: '#101010', restoBarra: '#FFFFFF', restoBarraTexto: '#101010' },
  B: { nombre: 'Propuesta B · Roja', desc: 'Cabecera roja de la marca, fondo gris muy claro y tarjetas blancas con borde fino. Se reconoce Divoox de un vistazo, al estilo de Rappi.',
    canvas: '#F6F6F6', headBg: '#F20D20', headText: '#FFFFFF', estadoColor: '#FFFFFF', chip: '#FFFFFF', chipText: '#101010', chipOn: '#F20D20', chipOnText: '#fff',
    cta: '#F20D20', tabOn: '#F20D20', radio: '16px', cardBorde: '1px solid #E6E7EA', sombra: '0 2px 8px rgba(16,16,16,.06)', buscador: '#FFFFFF', driverHoja: '#1F4D69', driverTexto: '#FFFFFF', restoBarra: '#F20D20', restoBarraTexto: '#FFFFFF' },
  C: { nombre: 'Propuesta C · Contraste negro', desc: 'Cabecera negra con detalles rojos y fondo blanco. Se ve seria y premium; el rojo resalta más porque está rodeado de negro.',
    canvas: '#FFFFFF', headBg: '#101010', headText: '#FFFFFF', estadoColor: '#FFFFFF', chip: '#F3F3F3', chipText: '#101010', chipOn: '#F20D20', chipOnText: '#fff',
    cta: '#F20D20', tabOn: '#101010', radio: '12px', cardBorde: '1px solid #ECECEC', sombra: 'none', buscador: '#262626', driverHoja: '#101010', driverTexto: '#FFFFFF', restoBarra: '#101010', restoBarraTexto: '#FFFFFF' },
};

const estado = () => `<div class="estado"><span>9:41</span><span>●●● ▮</span></div>`;
const tabCliente = (on) => `<div class="tab">${[['casa','Inicio'],['recibo','Pedidos'],['corazon','Favoritos'],['persona','Cuenta']].map(([i,t],k)=>`<div class="${k===on?'on':''}">${ic(i,24)}<span>${t}</span></div>`).join('')}</div>`;

function inicio(T) {
  const oscuro = T.headBg !== '#FFFFFF';
  return `${estado()}
  <div style="background:${T.headBg};color:${T.headText};padding:8px 16px 16px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div><div style="font-size:12px;opacity:.75">Entregar en</div>
      <div class="t" style="font-size:16px;display:flex;align-items:center;gap:4px">${ic('pin',18)} Av. Bolívar 24 ${ic('abajo',16)}</div></div>
      <div style="display:flex;gap:10px;align-items:center"><span style="font-weight:700;font-size:13px">🇪🇸 ES ▾</span>
      <div style="width:40px;height:40px;border-radius:20px;background:${oscuro?'rgba(255,255,255,.16)':'#F3F3F3'};display:flex;align-items:center;justify-content:center">${ic('campana',20)}</div></div>
    </div>
    <div style="margin-top:14px;height:46px;border-radius:23px;background:${T.buscador};color:${T.headBg==='#101010'?'#BDBDBD':'#666B73'};display:flex;align-items:center;gap:10px;padding:0 16px;font-size:14px">${ic('lupa',20)} Buscar comida o restaurantes</div>
  </div>
  <div style="padding:16px 0 0 16px;display:flex;gap:14px;overflow:hidden">
    ${[['servicio-comida-pizza','Comida'],['servicio-mercado','Mercado'],['servicio-moto','Moto'],['servicio-carro','Carro'],['servicio-envios','Envíos']].map(([f,t])=>`<div style="text-align:center;width:62px;flex:none"><div style="width:62px;height:62px;border-radius:16px;background:${T.canvas==='#FFFFFF'?'#F6F6F6':'#fff'};display:flex;align-items:center;justify-content:center"><img src="${A}${f}.png" style="width:46px;height:46px;object-fit:contain"></div><div style="font-size:12px;font-weight:600;margin-top:6px">${t}</div></div>`).join('')}
  </div>
  <div style="padding:16px 16px 0;display:flex;gap:8px;overflow:hidden"><span class="chip on">Ofertas</span><span class="chip">Entrega gratis</span><span class="chip">${ic('estrella',14)} 4,5+</span><span class="chip">Menos de 30 min</span></div>
  <div style="padding:20px 16px 0" class="t"><span style="font-size:19px">Cerca de ti</span></div>
  <div style="padding:12px 16px">
    <div class="card" style="overflow:hidden"><img class="foto" src="${A}relleno-restaurante-pizza.png" style="height:150px;border-radius:${T.cardBorde==='none'?T.radio:'0'}">
      <div style="padding:${T.cardBorde==='none'?'10px 2px':'12px'}"><div style="display:flex;justify-content:space-between"><span class="t" style="font-size:16px">Pizzería La Plaza</span><span style="font-weight:700;font-size:13px">4,8 ${ic('estrella',13)}</span></div>
      <div class="muted" style="font-size:13px;margin-top:3px">Pizza · 20–30 min · <span class="verde" style="font-weight:600">Entrega gratis</span></div></div></div>
  </div>
  ${tabCliente(0)}`;
}

function menu(T) {
  return `${estado()}
  <div style="position:relative"><img class="foto" src="${A}relleno-restaurante-pizza.png" style="height:180px">
    <div style="position:absolute;top:12px;left:12px;width:38px;height:38px;border-radius:19px;background:#fff;display:flex;align-items:center;justify-content:center">${ic('flecha',20)}</div></div>
  <div style="padding:16px 16px 4px;background:${T.canvas}"><div class="t" style="font-size:22px">Pizzería La Plaza</div>
    <div class="muted" style="font-size:13px;margin-top:4px">${ic('estrella',13)} 4,8 (320) · Pizza · 1,2 km</div>
    <div style="display:flex;gap:8px;margin-top:12px"><div class="card" style="flex:1;padding:10px;text-align:center;font-size:12px"><b>20–30 min</b><div class="muted">Entrega</div></div><div class="card" style="flex:1;padding:10px;text-align:center;font-size:12px"><b class="verde">Gratis</b><div class="muted">Envío</div></div></div></div>
  <div style="padding:10px 16px;display:flex;gap:8px;border-bottom:1px solid #ECECEC;background:${T.canvas}"><span class="chip on">Populares</span><span class="chip">Pizzas</span><span class="chip">Bebidas</span></div>
  <div style="padding:6px 16px">
    ${[['Pizza Margarita','Tomate, mozzarella y albahaca','$9,50','relleno-restaurante-pizza'],['Combo familiar','2 pizzas grandes y refresco','$24,90','relleno-combo-familiar'],['Pizza Pepperoni','Pepperoni y queso doble','$11,00','relleno-oferta-hamburguesa']].map(([n,d,p,f])=>`
      <div style="display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #ECECEC"><div style="flex:1"><div class="t" style="font-size:15px;font-weight:600">${n}</div><div class="muted" style="font-size:13px;margin:4px 0">${d}</div><div style="font-weight:700;font-size:14px">${p}</div></div>
      <div style="position:relative"><img src="${A}${f}.png" style="width:92px;height:92px;border-radius:12px;object-fit:cover"><div style="position:absolute;right:-4px;bottom:-4px;width:32px;height:32px;border-radius:16px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center">${ic('mas',18)}</div></div></div>`).join('')}
  </div>
  <div style="position:absolute;left:16px;right:16px;bottom:20px" class="btn">Ver carrito · 2 · $21,00</div>`;
}

function carrito(T) {
  return `${estado()}
  <div style="background:${T.headBg};color:${T.headText};padding:10px 16px 14px;display:flex;align-items:center;gap:12px">${ic('flecha',22)}<span class="t" style="font-size:19px">Tu carrito</span></div>
  <div style="padding:16px">
    <div class="card" style="padding:14px;${T.cardBorde==='none'?'border:1px solid #ECECEC;':''}"><div class="t" style="font-size:15px;margin-bottom:10px">Pizzería La Plaza</div>
    ${[['Pizza Margarita','Sin cebolla','$9,50'],['Pizza Pepperoni','Grande','$11,50']].map(([n,d,p])=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #F0F0F0"><div style="flex:1"><div style="font-weight:600;font-size:14px">${n}</div><div class="muted" style="font-size:12px">${d}</div></div>
    <div style="display:flex;align-items:center;gap:10px;border:1px solid #DADCE0;border-radius:18px;padding:4px 8px">${ic('menos',16)}<b style="font-size:13px">1</b>${ic('mas',16)}</div><b style="font-size:14px;width:52px;text-align:right">${p}</b></div>`).join('')}</div>
    <div class="t" style="font-size:16px;margin:18px 0 10px">Entrega</div>
    <div class="card" style="padding:14px;display:flex;gap:12px;align-items:center;${T.cardBorde==='none'?'border:1px solid #ECECEC;':''}">${ic('pin',20)}<div style="flex:1"><div style="font-weight:600;font-size:14px">Av. Bolívar 24</div><div class="muted" style="font-size:12px">El Vigía · 25–35 min</div></div>${ic('abajo',18)}</div>
    <div style="margin-top:18px;font-size:14px">
      ${[['Subtotal','$21,00'],['Envío','<span class="verde" style="font-weight:700">Gratis</span>'],['Servicio','$1,05']].map(([a,b])=>`<div style="display:flex;justify-content:space-between;padding:5px 0" class="muted"><span>${a}</span><span style="color:#101010">${b}</span></div>`).join('')}
      <div style="display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid #ECECEC;margin-top:6px" class="t"><span>Total</span><span>$22,05</span></div></div>
  </div>
  <div style="position:absolute;left:16px;right:16px;bottom:20px" class="btn">Pagar $22,05</div>`;
}

function seguimiento(T) {
  return `${estado()}
  <div style="height:330px;background:#E8ECEF;position:relative;overflow:hidden">
    <svg width="360" height="330" style="position:absolute"><path d="M0 80 H360 M0 200 H360 M90 0 V330 M250 0 V330 M0 300 L360 120" stroke="#fff" stroke-width="14" fill="none"/><path d="M70 270 C120 220 170 230 200 170 S260 110 290 90" stroke="#101010" stroke-width="5" fill="none"/></svg>
    <div style="position:absolute;left:58px;top:258px;width:24px;height:24px;border-radius:12px;background:#101010;border:4px solid #fff"></div>
    <div style="position:absolute;left:186px;top:154px;width:36px;height:36px;border-radius:18px;background:${T.cta};color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid #fff">${ic('moto',18)}</div>
    <div style="position:absolute;top:12px;left:12px;width:38px;height:38px;border-radius:19px;background:#fff;display:flex;align-items:center;justify-content:center">${ic('flecha',20)}</div></div>
  <div style="position:absolute;top:310px;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:20px 16px;box-shadow:0 -4px 16px rgba(0,0,0,.08)">
    <div style="width:40px;height:4px;border-radius:2px;background:#DADCE0;margin:-8px auto 14px"></div>
    <div class="muted" style="font-size:13px">Llega entre</div><div class="t" style="font-size:26px">9:58 – 10:05</div>
    <div style="display:flex;gap:6px;margin:14px 0">${[1,1,1,0].map(x=>`<div style="flex:1;height:5px;border-radius:3px;background:${x?'#0D7A3A':'#E3E5E8'}"></div>`).join('')}</div>
    <div style="font-weight:600;font-size:15px">Tu repartidor va en camino</div><div class="muted" style="font-size:13px;margin-top:2px">Recogió tu pedido en Pizzería La Plaza</div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px;border:1px solid #ECECEC;border-radius:14px">
      <div style="width:46px;height:46px;border-radius:23px;background:#F3F3F3;display:flex;align-items:center;justify-content:center">${ic('persona',24)}</div>
      <div style="flex:1"><div style="font-weight:700">Carlos</div><div class="muted" style="font-size:12px">${ic('estrella',12)} 4,9 · Moto roja</div></div>
      ${['chat','tel'].map(n=>`<div style="width:42px;height:42px;border-radius:21px;background:#F3F3F3;display:flex;align-items:center;justify-content:center">${ic(n,19)}</div>`).join('')}</div>
  </div>`;
}

function oferta(T) {
  const hoja = T.driverHoja, txt = T.driverTexto, sec = txt === '#FFFFFF' ? 'rgba(255,255,255,.7)' : '#666B73';
  return `<div class="estado" style="background:#1F4D69;color:#fff"><span>9:41</span><span>●●● ▮</span></div>
  <div style="height:730px;background:#DCE3E8;position:relative;overflow:hidden">
    <svg width="360" height="420" style="position:absolute"><path d="M0 60 H360 M0 230 H360 M120 0 V420 M280 0 V420 M0 380 L360 150" stroke="#fff" stroke-width="16" fill="none"/><path d="M60 330 C140 280 160 200 240 160" stroke="#1F4D69" stroke-width="5" fill="none"/></svg>
    <div style="position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#1F4D69;color:#fff;border-radius:22px;padding:9px 18px;font-family:Poppins;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;white-space:nowrap"><span style="width:9px;height:9px;border-radius:5px;background:#3DDC84"></span>En línea · $46,20 hoy</div>
    <div style="position:absolute;left:0;right:0;bottom:0;background:${hoja};color:${txt};border-radius:24px 24px 0 0;padding:20px 18px 24px;box-shadow:0 -6px 20px rgba(0,0,0,.15)">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:700;color:${sec}">NUEVA OFERTA · COMIDA</span>
        <div style="width:46px;height:46px;border-radius:23px;border:4px solid #4AA5DC;display:flex;align-items:center;justify-content:center" class="t">24</div></div>
      <div class="t" style="font-size:40px;margin-top:4px">$8,75</div>
      <div style="font-size:13px;color:${sec}">Incluye $3,00 de propina · 4,2 km · 18 min</div>
      <div style="margin:16px 0;display:flex;flex-direction:column;gap:12px;font-size:14px">
        <div style="display:flex;gap:10px"><span style="width:12px;height:12px;border-radius:6px;background:#4AA5DC;margin-top:4px"></span><div><b>Pizzería La Plaza</b><div style="color:${sec};font-size:12px">Recoger · 1,1 km</div></div></div>
        <div style="display:flex;gap:10px"><span style="width:12px;height:12px;border-radius:2px;background:${txt};margin-top:4px"></span><div><b>Av. Bolívar 24</b><div style="color:${sec};font-size:12px">Entregar · 3,1 km</div></div></div></div>
      <div style="display:flex;gap:10px"><div class="btn" style="flex:1;background:transparent;color:${txt};border:1.5px solid ${txt==='#FFFFFF'?'rgba(255,255,255,.4)':'#DADCE0'}">Rechazar</div><div class="btn" style="flex:2;background:#4AA5DC;color:#0B1F2B">Aceptar</div></div>
    </div></div>`;
}

function pedidosResto(T) {
  const b = T.restoBarra, bt = T.restoBarraTexto;
  return `<div class="estado" style="background:${b};color:${bt}"><span>9:41</span><span>●●● ▮</span></div>
  <div style="background:${b};color:${bt};padding:8px 16px 0;${b==='#FFFFFF'?'border-bottom:1px solid #ECECEC':''}">
    <div style="display:flex;justify-content:space-between;align-items:center"><div><div class="t" style="font-size:19px">Pedidos</div><div style="font-size:12px;opacity:.8;display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:4px;background:#3DDC84"></span>Abierto · Pizzería La Plaza</div></div>${ic('menu',24)}</div>
    <div style="display:flex;gap:20px;margin-top:12px;font-weight:600;font-size:14px">${[['Nuevos',2],['Preparando',3],['Listos',1]].map(([t,n],k)=>`<div style="padding-bottom:10px;border-bottom:3px solid ${k===0?(b==='#FFFFFF'?'#F20D20':'#fff'):'transparent'};opacity:${k===0?1:.75}">${t} <span style="background:${k===0?(b==='#FFFFFF'?'#F20D20':'#fff'):'transparent'};color:${k===0?(b==='#FFFFFF'?'#fff':b):'inherit'};border-radius:10px;padding:1px 7px;font-size:12px">${n}</span></div>`).join('')}</div></div>
  <div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:${T.canvas};height:640px">
    ${[['#4821','Ana M.','2 artículos · $21,00','hace 1 min',true],['#4822','Luis P.','4 artículos · $38,40','hace 3 min',true]].map(([n,c,d,h,nuevo])=>`
    <div class="card" style="padding:14px;${T.cardBorde==='none'?'border:1px solid #ECECEC;':''}">
